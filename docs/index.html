<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dérouille</title>
<meta name="description" content="Remise à niveau backend façon Mimo : quiz par niveaux et défis de code (Python, Django, DRF, PostgreSQL…).">
<meta name="theme-color" content="#F3F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10121B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dérouille">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone-first single column; three tabs (Apprendre · Coder · Profil) over a fixed bottom tab bar; quiz lessons and code exercises take the whole screen */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#E9ECF5; --ink:#151726; --muted:#5D6079; --line:#DFE2EE;
  --accent:#2E5BFF; --accent-ink:#FFFFFF; --on-track:#FFFFFF; --on-gold:#3A2600;
  --good:#17985A; --good-soft:#DDF5E8; --bad:#D93A40; --bad-soft:#FCE3E4; --warn:#A86400; --warn-soft:#FFF0D2;
  --gold:#E89B0C; --flame:#F07A1A;
  --code-bg:#1B1E2E; --code-ink:#E6E8F5; --code-kw:#FF8FB1; --code-str:#9BE38A; --code-num:#FFC86B; --code-com:#8087A8; --code-fn:#86C5FF;
  --t-python:#2F6DB5; --t-django:#0C8A5B; --t-drf:#C2342B; --t-sql:#7A5AF8;
  --t-http:#0E8FA0; --t-test:#9A6B14; --t-git:#B8472E; --t-archi:#5C5F75;
  --locked:#C9CCDA; --scrim:rgba(8,10,20,.5); --shadow:0 12px 32px rgba(20,24,50,.16);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121B; --surface:#1A1D2B; --surface-2:#232739; --ink:#ECEEF8; --muted:#A0A4BE; --line:#2C3044;
  --accent:#6E8BFF; --accent-ink:#0B0D16; --on-track:#0B0D16; --on-gold:#2A1C00;
  --good:#3FCB85; --good-soft:#143425; --bad:#FF6B70; --bad-soft:#3A1A1E; --warn:#F5B73B; --warn-soft:#3A2C10;
  --gold:#F5B73B; --flame:#FF8A3D;
  --code-bg:#0B0D15;
  --t-python:#5B98E0; --t-django:#2FBF86; --t-drf:#EF5A50; --t-sql:#9D85FF;
  --t-http:#3FC6D9; --t-test:#E0AA4C; --t-git:#F0775A; --t-archi:#9FA3BF;
  --locked:#3A3E55; --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121B; --surface:#1A1D2B; --surface-2:#232739; --ink:#ECEEF8; --muted:#A0A4BE; --line:#2C3044;
  --accent:#6E8BFF; --accent-ink:#0B0D16; --on-track:#0B0D16; --on-gold:#2A1C00;
  --good:#3FCB85; --good-soft:#143425; --bad:#FF6B70; --bad-soft:#3A1A1E; --warn:#F5B73B; --warn-soft:#3A2C10;
  --gold:#F5B73B; --flame:#FF8A3D;
  --code-bg:#0B0D15;
  --t-python:#5B98E0; --t-django:#2FBF86; --t-drf:#EF5A50; --t-sql:#9D85FF;
  --t-http:#3FC6D9; --t-test:#E0AA4C; --t-git:#F0775A; --t-archi:#9FA3BF;
  --locked:#3A3E55; --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}

html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.i{width:1em;height:1em;flex:0 0 auto}
.i-flame{color:var(--flame)} .i-bolt{color:var(--gold)} .i-heart{color:var(--bad)}
.star.on{color:var(--gold)} .star.off{color:var(--line)}
.crack{stroke:var(--bg)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--tc,var(--accent))}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn .i{width:20px;height:20px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad-soft)}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn .i{width:24px;height:24px}
.link{border:0;background:transparent;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:6px 2px}
.link .i{width:18px;height:18px}
.link.center{justify-self:center}
a.btn{text-decoration:none}
.codebox{display:block;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:var(--f-code);font-size:16px;line-height:1.4;padding:10px;resize:vertical;word-break:break-all}
.codebox:focus{outline:none;border-color:var(--accent)}
.ask{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:8px}
.ask .row .btn{flex:1;padding:10px 12px}
.sync a{color:var(--accent);font-weight:700}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.stats{display:flex;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.95rem}
.stat .i{width:18px;height:18px}
.stat.cold .i-flame{color:var(--locked)}
.stat.lit .i-flame{animation:flicker 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08,.95) rotate(-3deg)}60%{transform:scale(.96,1.06) rotate(3deg)}}
.ring-btn{position:relative;width:34px;height:34px;border:0;padding:0;background:transparent;display:grid;place-items:center;color:var(--good)}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.ring-btn .i{position:relative;width:15px;height:15px}

/* ---------- Barre d'onglets ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabbtn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tabbtn .i{width:24px;height:24px}
.tabbtn[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.tabbtn[aria-current="page"] .i{animation:tabPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes tabPop{from{transform:scale(.7)}to{transform:none}}

/* ---------- Apprendre ---------- */
.rank{margin-top:16px;display:grid;gap:6px}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem;color:var(--muted)}
.rank-row b{color:var(--ink);font-family:var(--f-display);font-size:1.15rem}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.goal>i{background:var(--good)}
.resume{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 12px;background:var(--surface);border:2px solid var(--tc);border-radius:16px;padding:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 35%,transparent);animation:up .35s ease-out}
.resume .btn{grid-column:1 / -1;grid-row:2;width:100%}
.resume .resume-x{grid-column:3;grid-row:1;align-self:start}
.resume-ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:var(--on-track)}
.resume-ic .i{width:22px;height:22px}
.resume-body{flex:1;min-width:0;display:grid;line-height:1.25}
.resume-body b{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-body small{color:var(--muted);font-size:.8rem}
.resume .btn{flex:0 0 auto}
.resume-x{padding:4px}
.resume-x .i{width:18px;height:18px}
.review{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.review p{margin:0;font-size:.92rem;color:var(--muted)}
.review strong{display:block;color:var(--ink)}
.tracks{margin-top:18px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tracks::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem}
.tab small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--tc);color:var(--tc)}
.track-head{margin-top:14px;border-radius:20px;padding:16px;background:var(--tc);color:var(--on-track)}
.track-head h2{font-size:1.5rem}
.track-head p{margin:4px 0 10px;opacity:.92;font-size:.95rem}
.track-head .bar{background:color-mix(in srgb,var(--on-track) 28%,transparent)}
.track-head .bar>i{background:var(--on-track)}
.track-head small{display:block;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}

.path{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:22px}
.step{display:flex;align-items:flex-start;gap:12px;transform:translateX(var(--dx,0))}
.step.flip{flex-direction:row-reverse}
.step-main{width:120px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:var(--tc);color:var(--on-track);box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000);position:relative}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.node.locked{background:var(--locked);color:var(--surface);box-shadow:0 6px 0 color-mix(in srgb,var(--locked) 70%,#000)}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--tc);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.node .i{width:30px;height:30px}
.node-label{font-weight:700;font-size:.86rem;text-align:center;line-height:1.25}
.stars{display:flex;gap:2px;height:16px}
.stars .i{width:16px;height:16px}
.defi{position:relative;margin-top:11px;width:54px;height:54px;border-radius:16px;border:2px solid var(--tc);background:var(--surface);color:var(--tc);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,transparent);font-weight:700;padding:0}
.defi .i{width:22px;height:22px}
.defi small{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.defi:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 45%,transparent)}
.defi.done{background:var(--tc);color:var(--on-track)}
.defi.locked{border-color:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.defi.open::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg);animation:dot 1.4s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.3)}}
.fresh{animation:unlock .75s cubic-bezier(.2,1.6,.4,1) .25s backwards}
@keyframes unlock{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- Coder ---------- */
.hero{margin-top:18px;display:grid;gap:4px}
.hero h1{font-size:1.9rem;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.notice{margin-top:12px;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.9rem}
.ex-list{margin-top:14px;display:grid;gap:10px}
.ex-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;box-shadow:0 3px 0 var(--line)}
.ex-card:active:not(.locked){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ex-ic{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 15%,transparent);color:var(--tc)}
.ex-ic .i{width:22px;height:22px}
.ex-card.done .ex-ic{background:var(--tc);color:var(--on-track)}
.ex-card.locked .ex-ic{background:var(--surface-2);color:var(--muted)}
.ex-card.locked .ex-title{color:var(--muted)}
.ex-body{flex:1;min-width:0;display:grid;gap:4px}
.ex-title{font-weight:700;font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.ex-end{flex:0 0 auto;color:var(--muted)}
.ex-end .i{width:20px;height:20px}
.diff{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.diff.d1{background:var(--good-soft);color:var(--good)}
.diff.d2{background:var(--warn-soft);color:var(--warn)}
.diff.d3{background:var(--bad-soft);color:var(--bad)}

/* ---------- Profil ---------- */
.rank-card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px}
.rank-card h1{font-size:2rem;letter-spacing:-.02em}
.rank-card p{margin:0;color:var(--muted);font-size:.9rem}
.ranks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.ranks li{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ranks li b{display:flex;align-items:center;gap:8px;font-weight:700}
.ranks li b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.ranks li.on{color:var(--ink)}
.ranks li.on b::before{background:var(--gold)}
.grid-stats{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--surface);text-align:center}
.tile b{display:block;font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.goal-card{margin-top:12px;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.goal-card .ring-btn{width:58px;height:58px;flex:0 0 auto}
.goal-card .ring-btn .i{width:24px;height:24px}
.goal-card p{margin:0;color:var(--muted);font-size:.9rem}
.goal-card strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.15rem}
.sec{margin-top:26px;margin-bottom:10px;font-size:1.25rem;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-size:.9rem;color:var(--muted);font-weight:400}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;display:grid;justify-items:center;align-content:start;gap:6px;text-align:center;font-size:.78rem;font-weight:700;line-height:1.2}
.medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold)}
.medal .i{width:24px;height:24px}
.badge.off{color:var(--muted)}
.badge.off .medal{background:var(--surface-2);color:var(--muted)}
.settings{display:grid;gap:10px}
.switch-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700}
.switch-row small{font-weight:400;color:var(--muted)}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.switch-row i{flex:0 0 auto;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch-row i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch-row input:checked + i{background:var(--good)}
.switch-row input:checked + i::after{transform:translateX(18px)}
.switch-row input:focus-visible + i{outline:3px solid var(--accent);outline-offset:2px}
.sync{margin-top:20px;font-size:.8rem;color:var(--muted);text-align:center}

/* ---------- Feuilles, toasts, effets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.scrim.closing{animation:fadeOut .18s ease-in forwards}
@keyframes fade{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:min(88vh,760px);overflow-y:auto;box-sizing:border-box;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sheet h3{font-size:1.4rem}
.sheet p{margin:0}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:70;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{width:100%;max-width:420px;box-sizing:border-box;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:.92rem;animation:toastIn .4s cubic-bezier(.2,1.4,.4,1)}
.toast b{display:block}
.toast>.i{width:22px;height:22px}
.toast.good>.i{color:var(--good)}
.toast.warn{background:var(--warn-soft);color:var(--ink)}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastIn{from{transform:translateY(-24px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-16px);opacity:0}}
.toast .medal{width:38px;height:38px;flex:0 0 auto;animation:spinIn .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.3)}}
.float{position:fixed;z-index:75;transform:translate(-50%,0);pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;animation:floatUp 1s ease-out forwards}
.float.gold{color:var(--gold)} .float.bad{color:var(--bad)} .float.warn{color:var(--warn)} .float.good{color:var(--good)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.shake{animation:shake .42s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ---------- Leçon (quiz) ---------- */
.lesson{min-height:100%;display:flex;flex-direction:column}
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;max-width:560px;margin:0 auto;width:100%;box-sizing:border-box}
.lbar .bar{flex:1;height:14px}
.lbar .bar>i{background:var(--good);position:relative}
.lbar .bar>i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:3px;border-radius:999px;background:rgba(255,255,255,.45)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.hearts .i{width:22px;height:22px}
.hearts.hit .i{animation:beat .5s}
@keyframes beat{30%{transform:scale(1.4)}60%{transform:scale(.88)}}
.combo{position:absolute;left:50%;top:calc(100% - 8px);transform:translate(-50%,-4px) scale(.7);opacity:0;display:flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--flame);color:var(--flame);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums;transition:opacity .2s,transform .2s;pointer-events:none}
.combo .i{width:16px;height:16px}
.combo.on{opacity:1;transform:translate(-50%,0) scale(1)}
.combo.bump{animation:bump .42s}
@keyframes bump{40%{transform:translate(-50%,0) scale(1.28)}}
.qzone{max-width:560px;margin:0 auto;width:100%;box-sizing:border-box;padding-inline:16px;padding-block:14px 190px;display:grid;gap:16px;align-content:start}
.qkind{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.25}
.qtext code,.explain code,.opt code,.brief code,.hint code,.sheet code,.toast code,.notice code{font-family:var(--f-code);font-size:.88em;background:color-mix(in srgb,var(--accent) 12%,transparent);padding:1px 5px;border-radius:6px;overflow-wrap:anywhere}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px;font-family:var(--f-code);font-size:.85rem;line-height:1.6;overflow-x:auto;white-space:pre;font-variant-ligatures:none}
pre.code code{background:none;padding:0}
.k{color:var(--code-kw)} .s{color:var(--code-str)} .n{color:var(--code-num)} .c{color:var(--code-com);font-style:italic} .f{color:var(--code-fn)}
.slot{display:inline-block;min-width:3.2em;padding:0 6px;margin:0 1px;border-radius:6px;border:0;border-bottom:2px dashed var(--code-num);background:rgba(255,255,255,.08);color:var(--code-num);font:inherit;line-height:1.4;text-align:center;vertical-align:baseline}
.slot.filled{border-bottom-style:solid;background:rgba(255,200,107,.18)}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1rem;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:flex-start}
.opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 3px 0 var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opt[aria-pressed="true"] .key{border-color:var(--accent);color:var(--accent)}
.opt.ok{border-color:var(--good);box-shadow:0 3px 0 var(--good);background:var(--good-soft);animation:okPop .4s}
.opt.ko{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-soft)}
@keyframes okPop{40%{transform:scale(1.03)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-family:var(--f-code);font-size:.9rem;box-shadow:0 3px 0 var(--line);white-space:pre}
.chip.used{visibility:hidden}
.built{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:grid;gap:6px;align-content:start}
.built:empty::before{content:"Touche les lignes dans le bon ordre";color:var(--muted);font-size:.9rem;padding:8px}
.line-chip{text-align:left;width:100%;box-sizing:border-box;overflow-x:auto}
.action{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.action.good{background:var(--good-soft);border-color:transparent}
.action.bad{background:var(--bad-soft);border-color:transparent}
.action-inner{max-width:560px;margin:0 auto;display:grid;gap:10px}
.action.good .action-inner,.action.bad .action-inner{animation:up .3s cubic-bezier(.2,1.3,.4,1)}
.fb-title{font-family:var(--f-display);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.fb-title .i{width:28px;height:28px;animation:spinIn .5s cubic-bezier(.2,1.4,.4,1)}
.good .fb-title{color:var(--good)} .bad .fb-title{color:var(--bad)}
.explain{margin:0;font-size:.95rem;max-height:30vh;overflow-y:auto}
.action .btn{width:100%;padding:14px}
.action.good .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.action.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}

/* ---------- Résultat ---------- */
.result{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:44px 60px;display:grid;gap:18px;justify-items:center;text-align:center}
.result h1{font-size:2.2rem;letter-spacing:-.02em}
.result>p{margin:0;color:var(--muted);max-width:40ch}
.big-stars{display:flex;gap:10px;justify-content:center}
.big-stars .i{width:56px;height:56px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.broken .i{width:72px;height:72px;animation:shake .5s .2s}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.meter{width:100%;display:grid;gap:6px;text-align:left}
.result .col{display:grid;gap:10px;width:100%}

/* ---------- Exercice ---------- */
.xbar-title{flex:1;min-width:0;display:grid;line-height:1.2}
.xbar-title span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--tc)}
.xbar-title b{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xzone{max-width:560px;margin:0 auto;box-sizing:border-box;padding-inline:16px;padding-block:6px 60px;display:grid;gap:12px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.brief p{margin:0}
.brief ul{margin:0;padding-left:20px;display:grid;gap:2px}
.hints{display:grid;gap:8px}
.hints:empty,#solBox:empty{display:none}
.hint{background:var(--warn-soft);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;animation:up .3s ease-out}
.hint>.i{width:22px;height:22px;color:var(--warn);margin-top:2px}
.hint p{margin:2px 0 0}
.sol summary,.v-sol summary{cursor:pointer;font-weight:700;padding:6px 0}
.sol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.symbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--lbar-h,56px));z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.symbar::-webkit-scrollbar{display:none}
.symbar button{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-code);font-size:1.05rem;font-weight:600;touch-action:manipulation}
.symbar button:active{background:var(--surface-2)}
.ed{display:block;width:100%;box-sizing:border-box;min-height:240px;resize:none;margin:0;padding:14px;border:2px solid transparent;border-radius:14px;background:var(--code-bg);color:var(--code-ink);caret-color:var(--code-num);font-family:var(--f-code);font-size:16px;line-height:1.55;tab-size:4;white-space:pre;overflow-x:auto;overflow-y:hidden;font-variant-ligatures:none}
.ed:focus{outline:none;border-color:var(--tc)}
.ed::selection{background:rgba(120,150,255,.4)}
.ed-tip{margin:0;font-size:.78rem;color:var(--muted)}
@media (hover:none){.ed-tip{display:none}}
.potential{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.potential b{color:var(--ink)}
.xactions{display:grid;grid-template-columns:auto 1fr;gap:10px}
.xactions .btn{padding:14px 16px}
.xactions small{font-weight:400;opacity:.8}

/* ---------- Correction ---------- */
.g-wrap{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:6px}
.scan{position:relative;width:190px;height:96px;border-radius:14px;background:var(--code-bg);padding:14px;box-sizing:border-box;display:grid;gap:9px;align-content:start;overflow:hidden}
.scan i{display:block;height:8px;border-radius:4px;background:var(--code-com)}
.scan i:nth-child(1){width:72%} .scan i:nth-child(2){width:46%;margin-left:16px;background:var(--code-kw)}
.scan i:nth-child(3){width:62%;margin-left:16px;background:var(--code-str)} .scan i:nth-child(4){width:34%;background:var(--code-fn)}
.scan b{position:absolute;left:0;right:0;top:6px;height:3px;background:var(--tc,var(--accent));box-shadow:0 0 14px 3px var(--tc,var(--accent));animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:6px}to{top:calc(100% - 9px)}}
.g-msg{font-weight:700}
.verdict{display:grid;gap:12px}
.v-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.v-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;animation:spinIn .55s cubic-bezier(.2,1.4,.4,1)}
.v-ic .i{width:24px;height:24px}
.verdict.good .v-ic{background:var(--good-soft);color:var(--good)} .verdict.good h3{color:var(--good)}
.verdict.warn .v-ic{background:var(--warn-soft);color:var(--warn)} .verdict.warn h3{color:var(--warn)}
.verdict.bad .v-ic{background:var(--bad-soft);color:var(--bad)} .verdict.bad h3{color:var(--bad)}
.v-score{margin-left:auto;font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict .big-stars .i{width:44px;height:44px}
.v-xp{text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
.v-syntax{display:flex;gap:8px;align-items:center;color:var(--bad);font-weight:700}
.v-syntax .i{width:18px;height:18px}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crit li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:8px 10px}
.crit li>.i{width:20px;height:20px;margin-top:2px}
.crit li.ok>.i{color:var(--good)} .crit li.ko>.i{color:var(--bad)} .crit li.bonus>.i{color:var(--muted)}
.crit b{display:block;font-size:.9rem}
.crit small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.v-fix{background:var(--warn-soft);border-radius:12px;padding:10px 14px}
.v-fix ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px;cursor:pointer}
.checklist input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good);flex:0 0 auto}
.rankup{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:10px}
.rankup .medal{width:84px;height:84px;animation:spinIn .8s cubic-bezier(.2,1.4,.4,1)}
.rankup .medal .i{width:42px;height:42px}
.rankup h2{font-size:2rem;letter-spacing:-.02em}
.rankup .btn{width:100%}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  {t:"mc", q:"Quelle fonction transforme une chaîne JSON en objet Python ?", o:["json.loads","json.dumps","json.dump","json.parse"], a:0, x:"`loads` = load string. `dumps` fait l'inverse. `load`/`dump` travaillent avec des fichiers."},
  {t:"mc", q:"Quand s'exécute un bloc `finally` ?", o:["Toujours, exception ou pas","Seulement s'il y a une exception","Seulement s'il n'y en a pas","Jamais si `return` est appelé"], a:0, x:"`finally` s'exécute dans tous les cas, même après un `return` dans le `try`."},
  {t:"order", q:"Remets dans l'ordre pour lire un fichier JSON.", lines:["import json",'with open("data.json") as f:',"    data = json.load(f)",'print(data["nom"])'], x:"Import, ouverture avec `with`, lecture dans le bloc, puis utilisation des données."},
  {t:"mc", q:"Une fonction fait `raise ValueError(\"x\")` et l'appelant n'a pas de `try`. Que se passe-t-il ?", o:["L'exception remonte et le programme s'arrête avec un traceback","La fonction renvoie None","Python ignore l'erreur","Seul un warning s'affiche"], a:0, x:"Une exception non attrapée remonte la pile d'appels jusqu'en haut et arrête le programme."}
 ]},
 { title:"Python avancé", qs:[
  {t:"mc", q:"Que crée une fonction qui contient `yield` ?", o:["Un générateur qui produit les valeurs à la demande","Une liste","Une coroutine async","Un thread"], a:0, x:"Un générateur calcule chaque valeur seulement quand on la demande : idéal pour de gros volumes."},
  {t:"mc", q:"Qu'affiche ce code ?", code:"def deco(f):\n    def wrapper():\n        return f() + 1\n    return wrapper\n\n@deco\ndef un():\n    return 1\n\nprint(un())", o:["2","1","None","Erreur"], a:0, x:"`@deco` remplace `un` par `wrapper`, qui appelle l'original puis ajoute 1."},
  {t:"fill", q:"Dans un décorateur, conserve le nom et la docstring de la fonction d'origine.", code:"from functools import ___\n\ndef deco(f):\n    @wraps(f)\n    def wrapper(*args, **kwargs):\n        return f(*args, **kwargs)\n    return wrapper", c:["wraps","partial","lru_cache","reduce"], a:["wraps"], x:"Sans `@wraps`, `un.__name__` vaudrait `\"wrapper\"`, ce qui brouille le débogage et les logs."},
  {t:"mc", q:"`def f(x: int) -> str:` puis `f(\"abc\")`. Que se passe-t-il ?", o:["Rien de spécial : Python ne vérifie pas les annotations à l'exécution","TypeError immédiat","Conversion automatique en int","SyntaxError"], a:0, x:"Les annotations servent aux outils (mypy, IDE). Pour une validation réelle, il faut du code ou une lib dédiée."},
  {t:"mc", q:"On appelle `charger()` (définie avec `async def`) sans `await`. Résultat ?", o:["Un objet coroutine, le corps ne s'exécute pas","Le résultat de la fonction","Une exception immédiate","Un thread démarre"], a:0, x:"Une coroutine doit être attendue (`await`) ou planifiée (ex : `asyncio.run`). Python affiche souvent un warning « was never awaited »."},
  {t:"mc", q:"Que vaut `sum(x * x for x in range(4))` ?", o:["14","30","16","9"], a:0, x:"0 + 1 + 4 + 9 = 14. L'expression génératrice évite de construire une liste intermédiaire."}
 ]}
]},
{ id:"django", name:"Django", color:"--t-django", desc:"Projet, modèles, ORM, vues : le cœur d'une app web.", levels:[
 { title:"Projet & apps", qs:[
  {t:"mc", q:"Quelle commande crée une nouvelle app `blog` ?", o:["`python manage.py startapp blog`","`django-admin newapp blog`","`python manage.py createapp blog`","`pip install blog`"], a:0, x:"`startapp` crée le dossier de l'app (models.py, views.py, …)."},
  {t:"mc", q:"Où déclarer une nouvelle app pour que Django la prenne en compte ?", o:["`INSTALLED_APPS` dans settings.py","urls.py","apps.py uniquement","`MIDDLEWARE`"], a:0, x:"Sans l'ajout dans `INSTALLED_APPS`, ses modèles et migrations sont ignorés."},
  {t:"mc", q:"Comment lancer le serveur de développement ?", o:["`python manage.py runserver`","`python manage.py start`","`django run`","`python app.py`"], a:0, x:"`runserver` lance un serveur de dev, à ne jamais utiliser en production."},
  {t:"mc", q:"Différence entre projet et app ?", o:["Le projet porte la config, une app est un module fonctionnel","C'est la même chose","Une app contient plusieurs projets","Le projet ne contient que les templates"], a:0, x:"Un projet = settings + urls racine. Une app = une fonctionnalité (blog, comptes…), réutilisable."},
  {t:"fill", q:"Complète l'import.", code:'from django.urls import ___\n\nurlpatterns = [\n    path("", views.accueil),\n]', c:["path","url","route","include"], a:["path"], x:"`path()` associe une route à une vue. `url()` est l'ancienne API, supprimée depuis Django 4.0."},
  {t:"mc", q:"À quoi sert `include()` dans urls.py ?", o:["Brancher les URLs d'une app dans celles du projet","Importer un template","Inclure un fichier settings","Charger un modèle"], a:0, x:'Ex : `path("blog/", include("blog.urls"))`.'}
 ]},
 { title:"Modèles & migrations", qs:[
  {t:"fill", q:"Complète la déclaration du modèle.", code:"from django.db import models\n\nclass Article(models.___):\n    titre = models.CharField(max_length=200)", c:["Model","Models","Base","Table"], a:["Model"], x:"Tout modèle hérite de `models.Model`."},
  {t:"mc", q:"Quel champ pour un titre court avec longueur max ?", o:["`CharField(max_length=200)`","`TextField()`","`StringField(200)`","`CharField()` sans argument"], a:0, x:"`CharField` exige `max_length`. `TextField` sert aux textes longs."},
  {t:"mc", q:"Tu modifies un modèle. Quelles commandes, dans l'ordre ?", o:["`makemigrations` puis `migrate`","`migrate` puis `makemigrations`","`syncdb`","`runserver` suffit"], a:0, x:"`makemigrations` génère le fichier de migration, `migrate` l'applique à la base."},
  {t:"fill", q:"Supprimer l'auteur doit supprimer ses articles.", code:"auteur = models.ForeignKey(\n    User, on_delete=models.___\n)", c:["CASCADE","DELETE","REMOVE","DROP"], a:["CASCADE"], x:"`CASCADE` supprime les objets liés. Autres options utiles : `PROTECT`, `SET_NULL` (avec `null=True`)."},
  {t:"mc", q:"À quoi sert `__str__` sur un modèle ?", o:["Donner une représentation lisible (admin, shell)","Valider les données","Définir la table SQL","Trier les résultats"], a:0, x:"Sans `__str__`, l'admin affiche « Article object (1) »."},
  {t:"mc", q:"Que fait `DateTimeField(auto_now_add=True)` ?", o:["Enregistre la date à la création uniquement","Met à jour la date à chaque sauvegarde","Rend le champ obligatoire dans les formulaires","Ajoute un index"], a:0, x:"`auto_now_add` = à la création. `auto_now` = à chaque `save()`."}
 ]},
 { title:"L'ORM", qs:[
  {t:"mc", q:"`Article.objects.get(pk=999)` alors que l'id n'existe pas :", o:["Lève `Article.DoesNotExist`","Renvoie None","Renvoie un QuerySet vide","Lève `KeyError`"], a:0, x:"`get()` attend exactement un résultat. Sinon `DoesNotExist` (0) ou `MultipleObjectsReturned` (2+)."},
  {t:"mc", q:"Que renvoie `.filter()` ?", o:["Un QuerySet (évalué paresseusement)","Une liste Python","Un seul objet","Un dict"], a:0, x:"Les QuerySets sont paresseux : aucune requête SQL tant qu'on ne les évalue pas."},
  {t:"fill", q:"Recherche « contient django », sans tenir compte de la casse.", code:'Article.objects.filter(titre_____="django")', c:["icontains","contains","like","ilike"], a:["icontains"], x:"Le préfixe `i` = insensible à la casse. `contains` est sensible à la casse."},
  {t:"mc", q:"Tu boucles sur des articles et affiches `article.auteur.nom` : une requête par article. Correctif ?", o:["`select_related(\"auteur\")`","`prefetch_related(\"auteur\")` obligatoirement","`.all()`","`.values()`"], a:0, x:"C'est le problème N+1. `select_related` fait une jointure SQL (ForeignKey/OneToOne). `prefetch_related` sert surtout au ManyToMany et aux relations inverses."},
  {t:"mc", q:"Quand la requête d'un QuerySet est-elle exécutée ?", o:["Quand on l'évalue (boucle, list(), len()…)","Dès sa création","À chaque `.filter()` chaîné","Uniquement avec `.execute()`"], a:0, x:"On peut chaîner `.filter().exclude().order_by()` sans coût : une seule requête au moment de l'évaluation."},
  {t:"fill", q:"Trie du plus récent au plus ancien.", code:'Article.objects.order_by("___date")', c:["-","+","!","desc "], a:["-"], x:"Le préfixe `-` inverse l'ordre (descendant)."}
 ]},
 { title:"Vues & templates", qs:[
  {t:"mc", q:"Quel est le premier paramètre d'une vue fonction ?", o:["request","self","response","kwargs"], a:0, x:"Django passe l'objet `HttpRequest` en premier argument."},
  {t:"fill", q:"Complète pour rendre un template.", code:'def liste(request):\n    articles = Article.objects.all()\n    return ___(request, "blog/liste.html", {"articles": articles})', c:["render","HttpResponse","redirect","template"], a:["render"], x:"`render(request, template, contexte)` renvoie une `HttpResponse` avec le HTML généré."},
  {t:"mc", q:"Syntaxe d'une boucle dans un template ?", o:["`{% for a in articles %}…{% endfor %}`","`{{ for a in articles }}`","`<for a in articles>`","`{% foreach articles %}`"], a:0, x:"Les tags `{% %}` ont souvent une balise de fermeture (`endfor`, `endif`, `endblock`)."},
  {t:"mc", q:"Différence entre `{{ }}` et `{% %}` ?", o:["`{{ }}` affiche une variable, `{% %}` exécute un tag","Aucune","`{{ }}` est pour les commentaires","`{% %}` affiche du HTML brut"], a:0, x:"`{{ article.titre }}` affiche, `{% if %}`/`{% for %}` contrôlent la logique."},
  {t:"mc", q:"Que faut-il mettre dans tout formulaire POST ?", o:["`{% csrf_token %}`","`{% secure %}`","`method=\"GET\"`","Rien, Django gère tout"], a:0, x:"Sécurité : le jeton CSRF empêche un site tiers de soumettre un formulaire à ta place. Sans lui, Django renvoie une 403."},
  {t:"mc", q:"Que fait `get_object_or_404(Article, pk=pk)` ?", o:["Renvoie l'objet ou lève `Http404`","Renvoie None si absent","Crée l'objet s'il manque","Renvoie un QuerySet"], a:0, x:"Raccourci propre pour les pages détail : pas besoin de gérer `DoesNotExist` à la main."}
 ]}
]},
{ id:"drf", name:"DRF", color:"--t-drf", desc:"Django REST Framework : serializers, ViewSets, permissions.", levels:[
 { title:"Serializers", qs:[
  {t:"mc", q:"Rôle d'un serializer ?", o:["Convertir objets ↔ JSON et valider les données","Gérer les URLs","Créer les tables","Authentifier l'utilisateur"], a:0, x:"Il sérialise (objet → JSON) et désérialise + valide (JSON → données propres)."},
  {t:"fill", q:"Complète pour un serializer basé sur un modèle.", code:'class ArticleSerializer(serializers.___):\n    class Meta:\n        model = Article\n        fields = ["id", "titre"]', c:["ModelSerializer","Serializer","ModelForm","Model"], a:["ModelSerializer"], x:"`ModelSerializer` génère les champs et `create()`/`update()` depuis le modèle."},
  {t:"mc", q:"Risque principal de `fields = \"__all__\"` ?", o:["Exposer des champs sensibles sans le vouloir","Ralentir les migrations","Rien, c'est recommandé","Bloquer la validation"], a:0, x:"Sécurité : liste explicitement les champs. Un champ ajouté plus tard au modèle serait exposé automatiquement."},
  {t:"mc", q:"Que faut-il appeler avant `serializer.save()` ?", o:["`serializer.is_valid()`","`serializer.clean()`","`serializer.validate()`","Rien"], a:0, x:"`save()` sans `is_valid()` lève une erreur. Les erreurs sont dans `serializer.errors`."},
  {t:"fill", q:"Complète le nom de la validation d'un champ.", code:"def ___titre(self, value):\n    if len(value) < 5:\n        raise serializers.ValidationError(\"Trop court\")\n    return value", c:["validate_","clean_","check_","is_valid_"], a:["validate_"], x:"Convention DRF : `validate_<nom_du_champ>`. (`clean_` est la convention des formulaires Django.)"},
  {t:"mc", q:"Que fait `read_only=True` sur un champ ?", o:["Renvoyé en sortie, ignoré en entrée","Champ caché dans la réponse","Champ obligatoire","Champ non modifiable en base"], a:0, x:"Idéal pour `id`, dates calculées, auteur défini côté serveur."}
 ]},
 { title:"Vues & ViewSets", qs:[
  {t:"mc", q:"Quelles actions fournit `ModelViewSet` ?", o:["list, create, retrieve, update, partial_update, destroy","Seulement list et retrieve","Seulement create","Aucune, il faut tout écrire"], a:0, x:"Le CRUD complet. `ReadOnlyModelViewSet` ne fournit que list et retrieve."},
  {t:"fill", q:"Complète le ViewSet.", code:"class ArticleViewSet(viewsets.ModelViewSet):\n    queryset = Article.objects.all()\n    ___ = ArticleSerializer", c:["serializer_class","serializer","serializers","model"], a:["serializer_class"], x:"`queryset` + `serializer_class` : le minimum pour un ModelViewSet."},
  {t:"mc", q:"Quel objet génère automatiquement les URLs d'un ViewSet ?", o:["Un router (ex : `DefaultRouter`)","`path()` seul","`include()` seul","Le serializer"], a:0, x:'`router.register("articles", ArticleViewSet)` puis on inclut `router.urls`.'},
  {t:"mc", q:"Quelle méthode HTTP pour une mise à jour partielle ?", o:["PATCH","PUT","POST","UPDATE"], a:0, x:"`PUT` remplace la ressource entière, `PATCH` modifie certains champs."},
  {t:"mc", q:"Code HTTP d'une création réussie ?", o:["201 Created","200 OK","204 No Content","202 Accepted"], a:0, x:"`CreateModelMixin` renvoie 201. 204 est typique d'une suppression réussie."},
  {t:"mc", q:"À quoi sert `@api_view([\"GET\"])` ?", o:["Transformer une vue fonction en vue DRF","Déclarer un ViewSet","Créer un serializer","Enregistrer une route"], a:0, x:"Il ajoute `Request`/`Response` DRF et limite les méthodes autorisées."}
 ]},
 { title:"Permissions & sécurité", qs:[
  {t:"fill", q:"Seuls les utilisateurs connectés peuvent accéder.", code:"class ArticleViewSet(viewsets.ModelViewSet):\n    permission_classes = [___]", c:["IsAuthenticated","AllowAny","IsAdminUser","IsLoggedIn"], a:["IsAuthenticated"], x:"`IsAuthenticated` refuse les requêtes anonymes. `IsLoggedIn` n'existe pas."},
  {t:"mc", q:"Différence entre 401 et 403 ?", o:["401 : non authentifié · 403 : authentifié mais non autorisé","Aucune","401 : serveur en panne · 403 : page absente","401 : autorisé · 403 : interdit"], a:0, x:"401 = « qui es-tu ? », 403 = « je sais qui tu es, mais non »."},
  {t:"mc", q:"Pourquoi filtrer `get_queryset()` avec `self.request.user` ?", o:["Chaque utilisateur ne voit que ses propres données","Pour accélérer le cache","Pour trier les résultats","C'est obligatoire dans DRF"], a:0, x:"Sécurité : sans ça, n'importe qui peut lire `/api/articles/42/` d'un autre utilisateur."},
  {t:"mc", q:"Où coder une permission « seul l'auteur peut modifier cet objet » ?", o:["`has_object_permission` d'une `BasePermission`","Dans le serializer","Dans `settings.py`","Dans le modèle"], a:0, x:"`has_permission` vérifie la vue, `has_object_permission` vérifie un objet précis."},
  {t:"mc", q:"Pourquoi `serializer.save(auteur=self.request.user)` dans `perform_create` ?", o:["L'auteur est fixé côté serveur, pas fourni par le client","Pour éviter une migration","Pour accélérer la requête","Pour valider le titre"], a:0, x:"Ne jamais faire confiance au client pour l'identité : il pourrait envoyer l'id d'un autre."},
  {t:"mc", q:"Où ranger la `SECRET_KEY` ?", o:["Dans une variable d'environnement, hors Git","Dans settings.py commité","Dans le README","Dans un template"], a:0, x:"Une clé commitée est compromise, même supprimée ensuite (elle reste dans l'historique)."}
 ]}
]},
{ id:"pg", name:"PostgreSQL", color:"--t-sql", desc:"Requêtes, jointures, index et transactions.", levels:[
 { title:"SELECT", qs:[
  {t:"mc", q:"Comment sélectionner toutes les colonnes de `articles` ?", o:["`SELECT * FROM articles;`","`GET * FROM articles;`","`SELECT ALL articles;`","`SELECT articles.*all;`"], a:0, x:"En pratique, préfère lister les colonnes utiles."},
  {t:"fill", q:"Seulement les articles publiés.", code:"SELECT titre FROM articles\n___ publie = true;", c:["WHERE","IF","FILTER","HAVING"], a:["WHERE"], x:"`WHERE` filtre les lignes avant tout regroupement."},
  {t:"fill", q:"Du plus récent au plus ancien.", code:"SELECT titre FROM articles\nORDER BY date ___;", c:["DESC","ASC","DOWN","REVERSE"], a:["DESC"], x:"`ASC` est l'ordre par défaut, `DESC` l'inverse."},
  {t:"mc", q:"Que fait `LIMIT 5` ?", o:["Renvoie au plus 5 lignes","Saute 5 lignes","Limite à 5 colonnes","Limite le temps à 5 s"], a:0, x:"Combine-le avec `ORDER BY` pour un résultat déterministe. `OFFSET` saute des lignes."},
  {t:"mc", q:"`WHERE titre LIKE 'Dj%'` trouve :", o:["Les titres qui commencent par « Dj »","Les titres qui finissent par « Dj »","Les titres égaux à « Dj% »","Les titres contenant « Dj » n'importe où"], a:0, x:"`%` = n'importe quelle suite de caractères. `ILIKE` = version insensible à la casse (spécifique à PostgreSQL)."},
  {t:"mc", q:"Pourquoi `WHERE x = NULL` ne renvoie rien ?", o:["Une comparaison avec NULL n'est jamais vraie : il faut `IS NULL`","NULL vaut 0","C'est une erreur de syntaxe","Il faut écrire `== NULL`"], a:0, x:"NULL = « inconnu ». `x = NULL` donne NULL (ni vrai ni faux)."}
 ]},
 { title:"Jointures & agrégats", qs:[
  {t:"mc", q:"Que renvoie un `INNER JOIN` ?", o:["Les lignes qui ont une correspondance des deux côtés","Toutes les lignes des deux tables","Toutes les lignes de gauche","Le produit cartésien"], a:0, x:"`JOIN` seul = `INNER JOIN`."},
  {t:"mc", q:"Et un `LEFT JOIN` ?", o:["Toutes les lignes de gauche, avec NULL si pas de correspondance","Seulement les lignes sans correspondance","Toutes les lignes de droite","Identique à INNER JOIN"], a:0, x:"Utile pour « auteurs avec ou sans articles »."},
  {t:"fill", q:"Nombre d'articles par auteur.", code:"SELECT auteur_id, ___(*)\nFROM articles\nGROUP BY auteur_id;", c:["COUNT","SUM","TOTAL","LEN"], a:["COUNT"], x:"`COUNT(*)` compte les lignes de chaque groupe."},
  {t:"mc", q:"Pour garder seulement les auteurs avec plus de 5 articles :", o:["`HAVING COUNT(*) > 5`","`WHERE COUNT(*) > 5`","`LIMIT 5`","`FILTER > 5`"], a:0, x:"`WHERE` filtre avant le regroupement, `HAVING` filtre après (sur les agrégats)."},
  {t:"order", q:"Remets cette requête dans l'ordre.", lines:["SELECT a.nom, COUNT(*)","FROM auteurs a","JOIN articles ar ON ar.auteur_id = a.id","GROUP BY a.nom","ORDER BY COUNT(*) DESC;"], x:"Ordre d'écriture : SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT."},
  {t:"mc", q:"En ORM Django, quelle méthode ajoute un compte à CHAQUE auteur ?", o:["`annotate(nb=Count(\"article\"))`","`aggregate(nb=Count(\"article\"))`","`count()`","`values(\"article\")`"], a:0, x:"`annotate` ajoute un champ par objet. `aggregate` renvoie un seul dict pour tout le QuerySet."}
 ]},
 { title:"Index & transactions", qs:[
  {t:"mc", q:"À quoi sert un index ?", o:["Accélérer les recherches, au prix d'écritures plus lentes","Chiffrer une colonne","Garantir l'unicité, toujours","Trier physiquement la table"], a:0, x:"Chaque INSERT/UPDATE doit aussi mettre à jour l'index : n'indexe que ce que tu filtres ou tries souvent."},
  {t:"mc", q:"Une `PRIMARY KEY` implique :", o:["Valeurs uniques et non NULL","Valeurs uniques, NULL autorisé","Auto-incrément obligatoire","Rien de plus qu'un nom"], a:0, x:"PostgreSQL crée aussi un index unique automatiquement."},
  {t:"mc", q:"Que garantit une transaction (atomicité) ?", o:["Tout est appliqué, ou rien","Les requêtes vont plus vite","Les données sont chiffrées","Aucun autre utilisateur ne peut lire"], a:0, x:"Si une étape échoue, tout est annulé (ROLLBACK)."},
  {t:"fill", q:"Version Django d'une transaction.", code:"from django.db import transaction\n\nwith transaction.___():\n    compte_a.save()\n    compte_b.save()", c:["atomic","begin","commit","lock"], a:["atomic"], x:"`transaction.atomic()` s'utilise en context manager ou en décorateur."},
  {t:"mc", q:"Quel est le problème ici ?", code:'cursor.execute(\n    f"SELECT * FROM users WHERE nom = \'{nom}\'"\n)', o:["Injection SQL : il faut passer des paramètres (`%s`)","Rien","Il manque un `;`","`cursor` n'existe pas en Django"], a:0, x:"Sécurité : `cursor.execute(\"... WHERE nom = %s\", [nom])` laisse le driver échapper la valeur. Avec l'ORM, tu es protégé par défaut."},
  {t:"mc", q:"Que montre `EXPLAIN ANALYZE` ?", o:["Le plan d'exécution avec les temps réels","Le schéma de la table","Les erreurs de syntaxe","L'historique des requêtes"], a:0, x:"Attention : `ANALYZE` exécute réellement la requête. Prudence avec un UPDATE ou un DELETE."}
 ]}
]},
{ id:"http", name:"HTTP & REST", color:"--t-http", desc:"Le langage des APIs : méthodes, codes de statut, design d'URLs.", levels:[
 { title:"HTTP", qs:[
  {t:"mc", q:"Une requête `GET` doit être :", o:["Sûre : elle ne modifie rien côté serveur","Utilisée pour supprimer","Toujours authentifiée","Envoyée avec un body JSON"], a:0, x:"GET lit. Pour modifier : POST, PUT, PATCH, DELETE. Un GET qui modifie des données est un anti-pattern (et un risque CSRF)."},
  {t:"mc", q:"Que signifie un code 404 ?", o:["Ressource introuvable","Erreur serveur","Non authentifié","Requête réussie sans contenu"], a:0, x:"Famille 4xx = erreur du client. 5xx = erreur du serveur."},
  {t:"mc", q:"Et un code 500 ?", o:["Erreur interne du serveur","Ressource déplacée","Requête mal formée","Trop de requêtes"], a:0, x:"Typiquement une exception non gérée dans ton code. Regarde les logs."},
  {t:"mc", q:"Laquelle de ces méthodes n'est PAS idempotente ?", o:["POST","GET","PUT","DELETE"], a:0, x:"Idempotent = répéter la requête donne le même état final. Deux POST créent deux ressources."},
  {t:"mc", q:"Quel `Content-Type` pour un body JSON ?", o:["application/json","text/json","json/application","text/plain"], a:0, x:"Sans le bon en-tête, beaucoup de serveurs (dont DRF) ne parsent pas le body comme du JSON."},
  {t:"mc", q:"Qu'apporte HTTPS par rapport à HTTP ?", o:["Le chiffrement du trafic (TLS)","Des requêtes plus rapides","La compression automatique","L'authentification des utilisateurs"], a:0, x:"Sécurité : sans HTTPS, tokens et mots de passe circulent en clair."}
 ]},
 { title:"Design d'API REST", qs:[
  {t:"mc", q:"Meilleure URL pour lister les commentaires de l'article 42 ?", o:["`GET /articles/42/commentaires`","`GET /getCommentaires?article=42`","`POST /articles/42/listerCommentaires`","`GET /commentaires/article-42/get`"], a:0, x:"Des noms (ressources) dans l'URL, l'action portée par la méthode HTTP."},
  {t:"mc", q:"Laquelle est un anti-pattern REST ?", o:["`POST /creerArticle`","`POST /articles`","`DELETE /articles/3`","`PATCH /articles/3`"], a:0, x:"Le verbe est déjà dans la méthode HTTP : pas besoin de « creer » dans l'URL."},
  {t:"mc", q:"Pourquoi paginer une liste ?", o:["Éviter de renvoyer des milliers de lignes d'un coup","C'est obligatoire en HTTP","Pour chiffrer les données","Pour éviter les migrations"], a:0, x:"Performance et mémoire, côté serveur comme côté client. DRF propose `PageNumberPagination` et d'autres."},

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
function prose(lines){
  let html = "", list = [];
  const flush = () => { if(list.length){ html += "<ul>" + list.map(li => "<li>" + md(li) + "</li>").join("") + "</ul>"; list = []; } };
  for(const l of lines){ if(l.startsWith("- ")) list.push(l.slice(2)); else { flush(); html += "<p>" + md(l) + "</p>"; } }

}
const shuffle = a => { const b = a.slice(); for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const KW_PY = new Set("def return if elif else for in while class import from as with try except finally raise pass None True False and or not lambda is yield async await assert break continue global del".split(" "));
const KW_SQL = new Set("SELECT FROM WHERE JOIN LEFT RIGHT INNER OUTER ON GROUP BY ORDER LIMIT OFFSET HAVING COUNT SUM AVG MIN MAX AS DESC ASC AND OR NOT NULL IS LIKE ILIKE IN INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE INDEX BEGIN COMMIT ROLLBACK PRIMARY KEY UNIQUE DISTINCT EXPLAIN ANALYZE TRUE FALSE".split(" "));
const KW_SH = new Set("git cd ls pip python".split(" "));
const KW_HTTP = new Set("GET POST PUT PATCH DELETE".split(" "));
function hl(src, lang){
  const sql = lang === "sql";
  const re = sql
    ? /(--[^\n]*)|('(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g
    : /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(@?[A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m;
  while((m = re.exec(src))){
    if(m[1]) out += '<span class="c">' + esc(m[1]) + "</span>";
    else if(m[2]) out += '<span class="s">' + esc(m[2]) + "</span>";
    else if(m[3]) out += '<span class="n">' + m[3] + "</span>";
    else if(m[4]){
      const w = m[4];
      const kw = sql ? KW_SQL.has(w.toUpperCase()) : lang === "bash" ? KW_SH.has(w) : lang === "text" ? KW_HTTP.has(w) : (KW_PY.has(w) || KW_SQL.has(w) || w[0] === "@");
      if(kw) out += '<span class="k">' + esc(w) + "</span>";
      else if(src[re.lastIndex] === "(") out += '<span class="f">' + esc(w) + "</span>";
      else out += esc(w);
    }
    else out += esc(m[5]);
  }
  return out;
}

function confetti(power = 1){
  if(reduceMotion) return;
  const c = document.createElement("canvas");
  c.className = "confetti";
  document.body.appendChild(c);
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext("2d");
  if(!ctx){ c.remove(); return; }
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colors = ["--t-python", "--t-django", "--t-drf", "--t-sql", "--gold", "--t-http", "--good", "--flame"].map(v => css.getPropertyValue(v).trim() || "#F5B73B");
  const P = [];
  const n = Math.round(70 * power);
  for(const side of [0, 1]) for(let i = 0; i < n; i++){
    const dir = side ? -1 : 1, sp = 9 + Math.random() * 9, ang = (55 + Math.random() * 30) * Math.PI / 180;
    P.push({x: side ? W + 10 : -10, y: H * .78, vx: dir * Math.cos(ang) * sp, vy: -Math.sin(ang) * sp * 1.35, w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
      r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[(i + side) % colors.length]});
  }
  const t0 = performance.now(); let last = t0;
  function frame(t){
    const dt = Math.min(34, t - last) / 16.67; last = t;
    const age = t - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1800) / 900);
    for(const p of P){
      p.vy += .32 * dt; p.vx *= .992; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1);
      ctx.restore();
    }
    if(age < 2700) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}

    const k = Math.min(1, (t - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3)));

function b64url(bytes){
  let s = "";

  return b;
}

    ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    : new TextDecoder().decode(bytes);
  const data = JSON.parse(json);
  if(!isObj(data) || typeof data.xp !== "number" || !isObj(data.levels)) throw new Error("contenu");
  return data;
}

  });
  document.getElementById("setSound").onchange = e => { prefs.sound = e.target.checked; savePrefs(); Sound.play("select"); rerenderHeader(); };
  document.getElementById("setHaptics").onchange = e => { prefs.haptics = e.target.checked; savePrefs(); Sound.play("tap"); buzz(30); };
  document.getElementById("resetBtn").onclick = () => {

      sh.close();

  document.getElementById("exportBtn").onclick = async () => {

    const box = sh.el.querySelector(".codebox");
    sh.el.querySelector("[data-copy]").onclick = async () => {
      if(await copyText(code)){
        Sound.play("coin");

        sh.close();
      } else {
        box.focus(); box.select();
        toast(`${ICON.copy}<span>Copie automatique refusée : le code est sélectionné, copie-le à la main.</span>`, "warn");
      }
    };

  document.getElementById("importBtn").onclick = () => {
    Sound.play("tap");
    const sh = openSheet(`<div class="eyebrow">Sauvegarde</div><h3>Importer un code</h3>
      <p class="muted small">Ta progression actuelle est fusionnée avec celle du code : tu gardes le meilleur des deux.</p>
      <textarea class="codebox" rows="4" placeholder="DEROUILLE1.…" aria-label="Code à importer"></textarea>
      <div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn" data-ok>Importer</button></div>`);
    const box = sh.el.querySelector(".codebox");
    try{ box.focus(); }catch(e){}
    sh.el.querySelector("[data-ok]").onclick = async () => {

      }
      const before = S.xp;

      rerender();
    };
  };
}

/* ===================== Leçon (quiz) ===================== */
let L = null;
function startLevel(tr, li){
  const items = tr.levels[li].qs.map((q, qi) => ({q, key:qKey(tr.id, li, qi), color:tr.color}));
  begin({mode:"level", tr, li, items, title:tr.levels[li].title});
}
function startReview(){
  const items = shuffle(S.missed.map(getQ).filter(Boolean)).slice(0, 8).map(g => ({q:g.q, key:g.key, color:g.track.color}));
  if(!items.length) return;
  begin({mode:"review", items, title:"Révision"});
}
function begin(o){
  L = Object.assign(o, {queue:o.items.slice(), total:o.items.length, solved:0, hearts:HEARTS, mistakes:0, wrong:new Set(), ans:null, combo:0, bestCombo:0, bonus:0, outcome:null});
  persistSession();
  save();
  openLesson();
}
function openLesson(){
  view = "lesson";
  showTabbar(false);
  window.scrollTo(0, 0);
  renderQuestion();
}
/* Leçon en cours : sauvegardée après chaque réponse (et synchronisée), pour reprendre où on s'est arrêté. */
function snapshotSession(){
  return {mode:L.mode, track:L.tr ? L.tr.id : null, li:L.mode === "level" ? L.li : null, title:L.title,
    keys:L.queue.map(it => it.key), total:L.total, solved:L.solved, hearts:L.hearts, mistakes:L.mistakes,
    wrong:[...L.wrong], combo:L.combo, bestCombo:L.bestCombo, bonus:L.bonus};
}
function persistSession(){ S.session = L ? snapshotSession() : null; S.sessionAt = Date.now(); }
function discardSession(){ S.session = null; S.sessionAt = Date.now(); save(); }
function sessionInfo(){
  const s = S.session;
  if(!s) return null;
  const items = s.keys.map(getQ).filter(Boolean);
  const tr = s.mode === "level" ? TRACKS.find(t => t.id === s.track) : null;
  if(!items.length || !(s.hearts > 0) || (s.mode === "level" && (!tr || !tr.levels[s.li]))) return null;
  return {s, items, tr};
}
function resumeLesson(){
  const info = sessionInfo();
  if(!info){ discardSession(); rerender(); return; }
  const {s, items, tr} = info;
  L = {mode:s.mode, tr, li:s.li, title: tr ? tr.levels[s.li].title : "Révision",
    queue: items.map(g => ({q:g.q, key:g.key, color:g.track.color})), total:s.total, solved:s.solved, hearts:s.hearts,
    mistakes:s.mistakes || 0, wrong:new Set(s.wrong || []), ans:null, combo:s.combo || 0, bestCombo:s.bestCombo || 0,
    bonus:s.bonus || 0, outcome:null};
  Sound.play("start");
  openLesson();
}
function pauseLesson(){
  if(!L) return;
  if(L.outcome){ const ctx = L, r = L.outcome; L = null; renderResult(ctx, r); return; }
  persistSession();
  save();
  L = null;
  Sound.play("tap");
  go("learn");
  toast(`${ICON.check}<span><b>Leçon en pause</b>Tu reprendras à la question où tu t'es arrêté${synced ? ", même sur un autre appareil" : ""}.</span>`);
}
function renderQuestion(){
  const it = L.queue[0], q = it.q;
  L.ans = q.t === "mc" ? null : [];
  const kind = {mc:"Choisis la bonne réponse", fill:"Complète le code", order:"Remets dans l'ordre"}[q.t];
  let body = "";
  if(q.t === "mc"){
    L.opts = shuffle(q.o.map((txt, i) => ({txt, ok:i === q.a})));
    body = (q.code ? `<pre class="code">${hl(q.code)}</pre>` : "") +
      `<div class="opts">${L.opts.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false"><span class="key">${"ABCD"[i]}</span><span>${md(o.txt)}</span></button>`).join("")}</div>`;
  } else if(q.t === "fill"){
    let n = 0;
    const code = hl(q.code.replace(/___/g, "\u0001")).replace(/\u0001/g, () => { n++; return `<button class="slot" data-s="${n - 1}" aria-label="Trou ${n}">&nbsp;</button>`; });
    L.slots = n;
    L.chips = shuffle(q.c);
    body = `<pre class="code">${code}</pre><div class="chips">${L.chips.map((c, i) => `<button class="chip" data-c="${i}">${esc(c)}</button>`).join("")}</div>`;
  } else {
    let sh = shuffle(q.lines.map((l, i) => i));
    if(sh.every((v, i) => v === i)) sh = sh.reverse();
    body = `<div class="built" id="built"></div><div class="chips" style="display:grid">${sh.map(i => `<button class="chip line-chip" data-l="${i}">${esc(q.lines[i])}</button>`).join("")}</div>`;
  }
  $app.innerHTML = `
  <div class="lesson" style="--tc:var(${it.color})">
    <div class="lbar">
      <button class="icon-btn" id="quit" aria-label="Mettre la leçon en pause">${ICON.close}</button>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.solved}"><i style="width:${L.solved / L.total * 100}%"></i></div>
      <span class="hearts" id="hearts" aria-label="${L.hearts} vies restantes">${ICON.heart}${L.hearts}</span>
      <span class="combo ${L.combo >= 2 ? "on" : ""}" id="combo" aria-live="polite">${ICON.flame}×${L.combo}</span>
    </div>
    <main class="qzone">
      <div class="qkind">${kind}</div>
      <div class="qtext">${md(q.q)}</div>
      ${body}
    </main>
    <div class="action" id="action" aria-live="polite"><div class="action-inner"><button class="btn" id="check" disabled>Vérifier</button></div></div>
  </div>`;
  document.getElementById("quit").onclick = pauseLesson;
  document.getElementById("check").onclick = check;
  if(q.t === "mc"){
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      $app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      L.ans = +b.dataset.i;
      Sound.play("select");
      updateCheck();
    });
  } else if(q.t === "fill"){
    $app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      const free = [...Array(L.slots).keys()].find(s => L.ans[s] == null);
      if(free == null) return;
      L.ans[free] = +b.dataset.c;
      b.classList.add("used");
      Sound.play("select");
      paintSlots();
    });
    $app.querySelectorAll(".slot").forEach(s => s.onclick = () => {
      const k = +s.dataset.s;
      if(L.ans[k] == null) return;
      $app.querySelector(`.chip[data-c="${L.ans[k]}"]`).classList.remove("used");
      L.ans[k] = null;
      Sound.play("tap");
      paintSlots();
    });
  } else {
    $app.querySelectorAll(".chips .line-chip").forEach(b => b.onclick = () => {
      L.ans.push(+b.dataset.l);
      b.classList.add("used");
      Sound.play("select");
      paintBuilt();
    });
  }
}
function paintSlots(){
  $app.querySelectorAll(".slot").forEach(s => {
    const v = L.ans[+s.dataset.s];
    s.textContent = v == null ? " " : L.chips[v];
    s.classList.toggle("filled", v != null);
  });
  updateCheck();
}
function paintBuilt(){
  const q = L.queue[0].q, built = document.getElementById("built");
  built.innerHTML = L.ans.map((li, k) => `<button class="chip line-chip" data-k="${k}">${esc(q.lines[li])}</button>`).join("");
  built.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const li = L.ans.splice(+b.dataset.k, 1)[0];
    $app.querySelector(`.chips .line-chip[data-l="${li}"]`).classList.remove("used");
    Sound.play("tap");
    paintBuilt();
  });
  updateCheck();
}
function updateCheck(){
  const q = L.queue[0].q;
  const ready = q.t === "mc" ? L.ans != null
    : q.t === "fill" ? [...Array(L.slots).keys()].every(s => L.ans[s] != null)
    : L.ans.length === q.lines.length;
  document.getElementById("check").disabled = !ready;
}
function check(){
  const it = L.queue[0], q = it.q;
  let ok, solution = "";
  if(q.t === "mc"){
    ok = L.opts[L.ans].ok;
    $app.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if(L.opts[i].ok) b.classList.add("ok"); else if(i === L.ans) b.classList.add("ko"); });
  } else if(q.t === "fill"){
    ok = q.a.every((v, i) => L.chips[L.ans[i]] === v);
    solution = "Réponse : <code>" + q.a.map(esc).join("</code>, <code>") + "</code>";
    $app.querySelectorAll(".chip,.slot").forEach(b => b.disabled = true);
  } else {
    ok = L.ans.every((v, i) => q.lines[v] === q.lines[i]);
    solution = `<pre class="code" style="margin-top:6px">${hl(q.lines.join("\n"))}</pre>`;
    $app.querySelectorAll(".chip").forEach(b => b.disabled = true);
  }
  L.queue.shift();
  S.stats.answered++;
  const heartsEl = document.getElementById("hearts"), comboEl = document.getElementById("combo");
  if(ok){
    L.solved++; L.combo++; S.stats.correct++;
    L.bestCombo = Math.max(L.bestCombo, L.combo);
    if(!L.wrong.has(it.key)) S.missed = S.missed.filter(k => k !== it.key);
    Sound.play("correct");
    buzz(12);
    if(L.combo >= 3){
      L.bonus++;
      setTimeout(() => Sound.play("combo", L.combo), 200);
      floatText("+1 XP combo", comboEl, "gold");
    }
  } else {
    L.hearts--; L.mistakes++; L.combo = 0;
    L.wrong.add(it.key);
    if(!S.missed.includes(it.key)) S.missed.push(it.key);
    L.queue.push(it);
    Sound.play("wrong");
    setTimeout(() => Sound.play("heart"), 170);
    buzz([30, 50, 30]);
    const qz = $app.querySelector(".qzone");
    if(qz && !reduceMotion){ qz.classList.remove("shake"); void qz.offsetWidth; qz.classList.add("shake"); }
  }
  heartsEl.innerHTML = ICON.heart + L.hearts;
  heartsEl.setAttribute("aria-label", L.hearts + " vies restantes");
  if(!ok){ heartsEl.classList.add("hit"); floatText("−1", heartsEl, "bad"); }
  comboEl.innerHTML = ICON.flame + "×" + L.combo;
  comboEl.classList.toggle("on", L.combo >= 2);
  if(L.combo >= 2){ comboEl.classList.remove("bump"); void comboEl.offsetWidth; comboEl.classList.add("bump"); }
  $app.querySelector(".lbar .bar>i").style.width = (L.solved / L.total * 100) + "%";
  /* Fin de leçon (réussie ou plus de vies) : enregistrée tout de suite, même si l'app est fermée avant « Continuer ». */
  const over = L.hearts <= 0 ? false : !L.queue.length ? true : null;
  if(over !== null) L.outcome = finalize(L, over);
  else persistSession();
  save();
  const act = document.getElementById("action");
  act.className = "action " + (ok ? "good" : "bad");
  const praise = L.combo >= 5 ? "Inarrêtable !" : L.combo >= 3 ? "Combo ×" + L.combo + " !" : ["Bien joué !", "Exact !", "Parfait !", "Ça revient !"][Math.floor(Math.random() * 4)];
  act.innerHTML = `<div class="action-inner">
    <div class="fb-title">${ok ? ICON.ok + esc(praise) : ICON.ko + "Pas tout à fait"}</div>
    <div class="explain">${!ok && solution ? solution + "<br>" : ""}${md(q.x)}</div>
    <button class="btn" id="next">${L.outcome ? "Voir le résultat" : "Continuer"}</button></div>`;
  const nx = document.getElementById("next");
  try{ nx.focus({preventScroll:true}); }catch(e){}
  nx.onclick = () => {
    if(L.outcome){ const ctx = L, r = L.outcome; L = null; renderResult(ctx, r); return; }
    window.scrollTo(0, 0);
    renderQuestion();
  };
}
function finalize(ctx, passed){
  S.stats.bestCombo = Math.max(S.stats.bestCombo, ctx.bestCombo);
  const xpBefore = S.xp, dailyBefore = dailyXp();
  let gained = 0, stars = 0, ev = {}, firstTime = false;
  if(passed){
    stars = ctx.mistakes === 0 ? 3 : ctx.mistakes === 1 ? 2 : 1;
    S.stats.lessons++;
    if(ctx.mistakes === 0) S.stats.perfect++;
    if(ctx.mode === "level"){
      const k = ctx.tr.id + ":" + ctx.li, prev = S.levels[k];
      firstTime = !prev;
      gained = (prev ? 5 : 10 + stars * 5) + ctx.bonus;
      S.levels[k] = {stars: Math.max(stars, prev ? prev.stars : 0)};
      if(firstTime) fresh = {track: ctx.tr.id, level: ctx.li};
    } else {
      S.stats.reviews++;
      gained = ctx.total * 2 + ctx.bonus;
    }
    ev = gainXp(gained);
    bumpStreak();
  }
  S.session = null;
  S.sessionAt = Date.now();
  const badges = checkBadges();
  return {passed, stars, gained, firstTime, xpBefore, dailyBefore, ev, badges};
}
function renderResult(ctx, r){
  view = "result";
  showTabbar(false);
  window.scrollTo(0, 0);
  const ri = rankInfo(S.xp), rb = rankInfo(r.xpBefore);
  const tr = ctx.tr;
  const defi = r.passed && ctx.mode === "level" && !S.ex[tr.id + ":" + ctx.li] ? exFor(tr.id, ctx.li) : null;
  const nextLevel = r.passed && ctx.mode === "level" && ctx.li + 1 < tr.levels.length ? ctx.li + 1 : null;
  const title = !r.passed ? "Plus de vies" : r.stars === 3 ? "Sans faute !" : ctx.mode === "review" ? "Révision terminée" : "Niveau terminé";
  const text = !r.passed ? "Les questions ratées sont dans ta révision. Relis les explications et retente."
    : ctx.mode === "review" ? "Les questions réussies du premier coup sortent de ta liste."
    : defi && r.firstTime ? "Nouveau défi code débloqué : mets les mains dans le code."
    : "« " + esc(ctx.title) + " » est validé.";
  $app.innerHTML = `<div class="result" style="--tc:var(${tr ? tr.color : "--accent"})">
    ${r.passed ? `<div class="big-stars" aria-label="${r.stars} étoiles sur 3">${bigStars(r.stars)}</div>` : `<div class="broken">${ICON.broken}</div>`}
    <h1>${title}</h1>
    <p>${text}</p>
    ${r.passed ? `<div class="tiles">
      <div class="tile"><b id="xpGain">0</b><span>XP gagnés</span></div>
      <div class="tile"><b>${ctx.bestCombo}</b><span>Meilleur combo</span></div>
      <div class="tile"><b>${liveStreak()}</b><span>Série</span></div>
    </div>
    <div class="meter"><div class="rank-row"><b>Objectif du jour</b><span>${Math.min(dailyXp(), DAILY_GOAL)} / ${DAILY_GOAL} XP</span></div><div class="bar goal"><i id="goalBar" style="width:${Math.min(100, r.dailyBefore / DAILY_GOAL * 100)}%"></i></div></div>
    <div class="meter"><div class="rank-row"><b>${esc(ri.cur.name)}</b><span>${ri.next ? (ri.next.xp - S.xp) + " XP avant « " + esc(ri.next.name) + " »" : "Rang maximum"}</span></div><div class="bar"><i id="rankBar" style="width:${rb.cur === ri.cur ? rb.pct : 0}%"></i></div></div>` : ""}
    <div class="col">
      ${defi ? `<button class="btn" id="goDefi">${ICON.code}Relever le défi code</button>` : ""}
      ${nextLevel != null ? `<button class="btn ${defi ? "ghost" : ""}" id="nextLv">Niveau suivant</button>` : ""}
      ${!r.passed && ctx.mode === "level" ? `<button class="btn" id="retry">Réessayer</button>` : ""}
      <button class="btn ghost" id="home">Retour au parcours</button>
    </div>
  </div>`;
  if(r.passed){
    Sound.play("complete");
    buzz([20, 40, 20]);
    confetti(r.stars === 3 ? 1.3 : .9);
    for(let i = 0; i < r.stars; i++) setTimeout(() => Sound.play("star", i), 420 + i * 300);
    setTimeout(() => countUp(document.getElementById("xpGain"), r.gained), 900);
    grow(document.getElementById("goalBar"), dailyXp() / DAILY_GOAL * 100);
    grow(document.getElementById("rankBar"), ri.pct);
    celebrate(r.ev, r.badges, 1900);
  } else {
    Sound.play("fail");
    buzz([60, 40, 60]);
    celebrate({}, r.badges, 900);
  }
  document.getElementById("home").onclick = () => { Sound.play("tap"); go("learn"); };
  const rt = document.getElementById("retry"); if(rt) rt.onclick = () => { Sound.play("start"); startLevel(tr, ctx.li); };
  const nl = document.getElementById("nextLv"); if(nl) nl.onclick = () => { Sound.play("start"); startLevel(tr, nextLevel); };
  const gd = document.getElementById("goDefi"); if(gd) gd.onclick = () => { Sound.play("tap"); startExercise(tr, ctx.li, "learn"); };
  const first = document.querySelector(".result .btn");
  if(first) try{ first.focus({preventScroll:true}); }catch(e){}
}

/* ===================== Défis code ===================== */
let X = null;
let grader = null, graderState = "pending";
const gradeCache = new Map();
const normCode = s => s.replace(/[ \t]+$/gm, "").trim();
const SMART_TEST = /[“”„«»‘’‚—–…]/;
const SMART_ALL = /[“”„«»‘’‚—–…]/g;
const SMART_MAP = {"“":'"', "”":'"', "„":'"', "«":'"', "»":'"', "‘":"'", "’":"'", "‚":"'", "—":"--", "–":"-", "…":"..."};
const unsmart = s => s.replace(SMART_ALL, c => SMART_MAP[c]);
const graderReady = (async () => {
  try{
    if(!window.claude || typeof window.claude.use !== "function"){ graderState = "off"; return; }
    const s = await window.claude.use("sample");
    grader = s || null;
    graderState = s ? "ready" : "off";
  }catch(e){ graderState = "off"; }
  finally{
    if(view === "code") rerender();
    const b = document.getElementById("xcheck");
    if(b) b.innerHTML = checkLabel();
  }
})();
const checkLabel = () => graderState === "off" ? "Vérifier mon code" : "Valider";
function startExercise(tr, i, from){
  const ex = exFor(tr.id, i), key = tr.id + ":" + i, rec = S.ex[key];
  const draft = isObj(S.drafts[key]) ? S.drafts[key] : {};
  X = {tr, i, ex, key, from: from || (view === "code" ? "code" : "learn"), hints: Math.min(Number(draft.hints) || 0, ex.hints.length), seen: !!draft.seen,
    code: typeof draft.code === "string" ? draft.code : rec && rec.code ? rec.code : ex.starter, busy: false, ta: null};
  view = "exercise";
  showTabbar(false);
  window.scrollTo(0, 0);
  Sound.play("start");
  renderExercise();
}
/* Brouillon du défi : gardé dans la progression (donc synchronisé), sauf s'il n'y a rien de neuf. */
function saveDraft(){
  if(!X) return;
  const code = X.ta ? X.ta.value : X.code;
  if(normCode(code) === normCode(X.ex.starter) && !X.hints && !X.seen){
    delete S.drafts[X.key];
    if(S.lastEx === X.key) S.lastEx = null;
  } else {
    S.drafts[X.key] = {code, hints: X.hints, seen: X.seen, at: Date.now()};
    S.lastEx = X.key;
  }
  save();
}
const potentialStars = () => X.seen ? 1 : Math.max(1, 3 - X.hints);
function potentialXp(){
  const rec = S.ex[X.key], st = potentialStars();
  return rec ? Math.max(0, st - (rec.stars || 0)) * 5 : DIFF[X.ex.diff].base + st * 5;
}
function potentialHtml(){
  const xp = potentialXp();
  return `<span>Gain possible</span><span class="stars">${starsHtml(potentialStars())}</span><b>${xp ? "+" + xp + " XP" : "déjà réussi"}</b>`;
}
const hintHtml = (h, k) => `<div class="hint">${ICON.bulb}<div><b>Indice ${k + 1}</b><p>${md(h)}</p></div></div>`;
const solHtml = () => `<details class="sol" open><summary>Solution de référence</summary><pre class="code">${hl(X.ex.solution, X.ex.lang)}</pre></details>`;
function hintBtnHtml(){
  const left = X.ex.hints.length - X.hints;
  return `${ICON.bulb}<span>Indice${left ? ` <small>(${left})</small>` : ""}</span>`;
}
function renderExercise(){
  const {tr, ex} = X, d = DIFF[ex.diff];
  $app.innerHTML = `<div class="xscreen" style="--tc:var(${tr.color})">
    <div class="lbar" id="xbar">
      <button class="icon-btn" id="xquit" aria-label="Quitter le défi">${ICON.close}</button>
      <div class="xbar-title"><span>Défi · ${esc(tr.name)}</span><b>${esc(ex.title)}</b></div>
      <span class="diff ${d.cls}">${d.label}</span>
    </div>
    <main class="xzone">

      <div class="hints" id="hintBox">${ex.hints.slice(0, X.hints).map(hintHtml).join("")}</div>
      <div id="solBox">${X.seen ? solHtml() : ""}</div>
