<title>Dérouille</title>
<!--@FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<!--@/FONTS-->
<style>
/* Layout: phone-first single column; three tabs (Apprendre · Coder · Profil) over a fixed bottom tab bar; quiz lessons and code exercises take the whole screen */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#E9ECF5; --ink:#151726; --muted:#5D6079; --line:#DFE2EE;
  --accent:#2E5BFF; --accent-ink:#FFFFFF; --on-track:#FFFFFF; --on-gold:#3A2600;
  --good:#17985A; --good-soft:#DDF5E8; --bad:#D93A40; --bad-soft:#FCE3E4; --warn:#A86400; --warn-soft:#FFF0D2;
  --gold:#E89B0C; --flame:#F07A1A;
  --code-bg:#1B1E2E; --code-ink:#E6E8F5; --code-kw:#FF8FB1; --code-str:#9BE38A; --code-num:#FFC86B; --code-com:#8087A8; --code-fn:#86C5FF;
  --t-python:#2F6DB5; --t-django:#0C8A5B; --t-drf:#C2342B; --t-sql:#7A5AF8;
  --t-http:#0E8FA0; --t-test:#9A6B14; --t-git:#B8472E; --t-archi:#5C5F75;
  --locked:#C9CCDA; --scrim:rgba(8,10,20,.5); --shadow:0 12px 32px rgba(20,24,50,.16);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121B; --surface:#1A1D2B; --surface-2:#232739; --ink:#ECEEF8; --muted:#A0A4BE; --line:#2C3044;
  --accent:#6E8BFF; --accent-ink:#0B0D16; --on-track:#0B0D16; --on-gold:#2A1C00;
  --good:#3FCB85; --good-soft:#143425; --bad:#FF6B70; --bad-soft:#3A1A1E; --warn:#F5B73B; --warn-soft:#3A2C10;
  --gold:#F5B73B; --flame:#FF8A3D;
  --code-bg:#0B0D15;
  --t-python:#5B98E0; --t-django:#2FBF86; --t-drf:#EF5A50; --t-sql:#9D85FF;
  --t-http:#3FC6D9; --t-test:#E0AA4C; --t-git:#F0775A; --t-archi:#9FA3BF;
  --locked:#3A3E55; --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121B; --surface:#1A1D2B; --surface-2:#232739; --ink:#ECEEF8; --muted:#A0A4BE; --line:#2C3044;
  --accent:#6E8BFF; --accent-ink:#0B0D16; --on-track:#0B0D16; --on-gold:#2A1C00;
  --good:#3FCB85; --good-soft:#143425; --bad:#FF6B70; --bad-soft:#3A1A1E; --warn:#F5B73B; --warn-soft:#3A2C10;
  --gold:#F5B73B; --flame:#FF8A3D;
  --code-bg:#0B0D15;
  --t-python:#5B98E0; --t-django:#2FBF86; --t-drf:#EF5A50; --t-sql:#9D85FF;
  --t-http:#3FC6D9; --t-test:#E0AA4C; --t-git:#F0775A; --t-archi:#9FA3BF;
  --locked:#3A3E55; --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}

html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.i{width:1em;height:1em;flex:0 0 auto}
.i-flame{color:var(--flame)} .i-bolt{color:var(--gold)} .i-heart{color:var(--bad)}
.star.on{color:var(--gold)} .star.off{color:var(--line)}
.crack{stroke:var(--bg)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--tc,var(--accent))}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn .i{width:20px;height:20px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad-soft)}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn .i{width:24px;height:24px}
.link{border:0;background:transparent;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:6px 2px}
.link .i{width:18px;height:18px}
.link.center{justify-self:center}
a.btn{text-decoration:none}
.codebox{display:block;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:var(--f-code);font-size:16px;line-height:1.4;padding:10px;resize:vertical;word-break:break-all}
.codebox:focus{outline:none;border-color:var(--accent)}
.ask{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:8px}
.ask .row .btn{flex:1;padding:10px 12px}
.sync a{color:var(--accent);font-weight:700}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.stats{display:flex;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.95rem}
.stat .i{width:18px;height:18px}
.stat.cold .i-flame{color:var(--locked)}
.stat.lit .i-flame{animation:flicker 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08,.95) rotate(-3deg)}60%{transform:scale(.96,1.06) rotate(3deg)}}
.ring-btn{position:relative;width:34px;height:34px;border:0;padding:0;background:transparent;display:grid;place-items:center;color:var(--good)}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.ring-btn .i{position:relative;width:15px;height:15px}

/* ---------- Barre d'onglets ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabbtn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tabbtn .i{width:24px;height:24px}
.tabbtn[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.tabbtn[aria-current="page"] .i{animation:tabPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes tabPop{from{transform:scale(.7)}to{transform:none}}

/* ---------- Apprendre ---------- */
.rank{margin-top:16px;display:grid;gap:6px}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem;color:var(--muted)}
.rank-row b{color:var(--ink);font-family:var(--f-display);font-size:1.15rem}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.goal>i{background:var(--good)}
.resume{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 12px;background:var(--surface);border:2px solid var(--tc);border-radius:16px;padding:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 35%,transparent);animation:up .35s ease-out}
.resume .btn{grid-column:1 / -1;grid-row:2;width:100%}
.resume .resume-x{grid-column:3;grid-row:1;align-self:start}
.resume-ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:var(--on-track)}
.resume-ic .i{width:22px;height:22px}
.resume-body{flex:1;min-width:0;display:grid;line-height:1.25}
.resume-body b{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-body small{color:var(--muted);font-size:.8rem}
.resume .btn{flex:0 0 auto}
.resume-x{padding:4px}
.resume-x .i{width:18px;height:18px}
.review{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.review p{margin:0;font-size:.92rem;color:var(--muted)}
.review strong{display:block;color:var(--ink)}
.tracks{margin-top:18px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tracks::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem}
.tab small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--tc);color:var(--tc)}
.track-head{margin-top:14px;border-radius:20px;padding:16px;background:var(--tc);color:var(--on-track)}
.track-head h2{font-size:1.5rem}
.track-head p{margin:4px 0 10px;opacity:.92;font-size:.95rem}
.track-head .bar{background:color-mix(in srgb,var(--on-track) 28%,transparent)}
.track-head .bar>i{background:var(--on-track)}
.track-head small{display:block;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}

.path{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:22px}
.step{display:flex;align-items:flex-start;gap:12px;transform:translateX(var(--dx,0))}
.step.flip{flex-direction:row-reverse}
.step-main{width:120px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:var(--tc);color:var(--on-track);box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000);position:relative}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.node.locked{background:var(--locked);color:var(--surface);box-shadow:0 6px 0 color-mix(in srgb,var(--locked) 70%,#000)}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--tc);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.node .i{width:30px;height:30px}
.node-label{font-weight:700;font-size:.86rem;text-align:center;line-height:1.25}
.stars{display:flex;gap:2px;height:16px}
.stars .i{width:16px;height:16px}
.defi{position:relative;margin-top:11px;width:54px;height:54px;border-radius:16px;border:2px solid var(--tc);background:var(--surface);color:var(--tc);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,transparent);font-weight:700;padding:0}
.defi .i{width:22px;height:22px}
.defi small{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.defi:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 45%,transparent)}
.defi.done{background:var(--tc);color:var(--on-track)}
.defi.locked{border-color:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.defi.open::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg);animation:dot 1.4s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.3)}}
.fresh{animation:unlock .75s cubic-bezier(.2,1.6,.4,1) .25s backwards}
@keyframes unlock{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- Coder ---------- */
.hero{margin-top:18px;display:grid;gap:4px}
.hero h1{font-size:1.9rem;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.notice{margin-top:12px;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.9rem}
.ex-list{margin-top:14px;display:grid;gap:10px}
.ex-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;box-shadow:0 3px 0 var(--line)}
.ex-card:active:not(.locked){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ex-ic{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 15%,transparent);color:var(--tc)}
.ex-ic .i{width:22px;height:22px}
.ex-card.done .ex-ic{background:var(--tc);color:var(--on-track)}
.ex-card.locked .ex-ic{background:var(--surface-2);color:var(--muted)}
.ex-card.locked .ex-title{color:var(--muted)}
.ex-body{flex:1;min-width:0;display:grid;gap:4px}
.ex-title{font-weight:700;font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.ex-end{flex:0 0 auto;color:var(--muted)}
.ex-end .i{width:20px;height:20px}
.diff{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.diff.d1{background:var(--good-soft);color:var(--good)}
.diff.d2{background:var(--warn-soft);color:var(--warn)}
.diff.d3{background:var(--bad-soft);color:var(--bad)}

/* ---------- Profil ---------- */
.rank-card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px}
.rank-card h1{font-size:2rem;letter-spacing:-.02em}
.rank-card p{margin:0;color:var(--muted);font-size:.9rem}
.ranks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.ranks li{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ranks li b{display:flex;align-items:center;gap:8px;font-weight:700}
.ranks li b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.ranks li.on{color:var(--ink)}
.ranks li.on b::before{background:var(--gold)}
.grid-stats{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--surface);text-align:center}
.tile b{display:block;font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.goal-card{margin-top:12px;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.goal-card .ring-btn{width:58px;height:58px;flex:0 0 auto}
.goal-card .ring-btn .i{width:24px;height:24px}
.goal-card p{margin:0;color:var(--muted);font-size:.9rem}
.goal-card strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.15rem}
.sec{margin-top:26px;margin-bottom:10px;font-size:1.25rem;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-size:.9rem;color:var(--muted);font-weight:400}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;display:grid;justify-items:center;align-content:start;gap:6px;text-align:center;font-size:.78rem;font-weight:700;line-height:1.2}
.medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold)}
.medal .i{width:24px;height:24px}
.badge.off{color:var(--muted)}
.badge.off .medal{background:var(--surface-2);color:var(--muted)}
.settings{display:grid;gap:10px}
.switch-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700}
.switch-row small{font-weight:400;color:var(--muted)}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.switch-row i{flex:0 0 auto;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch-row i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch-row input:checked + i{background:var(--good)}
.switch-row input:checked + i::after{transform:translateX(18px)}
.switch-row input:focus-visible + i{outline:3px solid var(--accent);outline-offset:2px}
.sync{margin-top:20px;font-size:.8rem;color:var(--muted);text-align:center}

/* ---------- Feuilles, toasts, effets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.scrim.closing{animation:fadeOut .18s ease-in forwards}
@keyframes fade{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:min(88vh,760px);overflow-y:auto;box-sizing:border-box;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sheet h3{font-size:1.4rem}
.sheet p{margin:0}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:70;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{width:100%;max-width:420px;box-sizing:border-box;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:.92rem;animation:toastIn .4s cubic-bezier(.2,1.4,.4,1)}
.toast b{display:block}
.toast>.i{width:22px;height:22px}
.toast.good>.i{color:var(--good)}
.toast.warn{background:var(--warn-soft);color:var(--ink)}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastIn{from{transform:translateY(-24px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-16px);opacity:0}}
.toast .medal{width:38px;height:38px;flex:0 0 auto;animation:spinIn .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.3)}}
.float{position:fixed;z-index:75;transform:translate(-50%,0);pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;animation:floatUp 1s ease-out forwards}
.float.gold{color:var(--gold)} .float.bad{color:var(--bad)} .float.warn{color:var(--warn)} .float.good{color:var(--good)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px)}}

<script>
"use strict";
/*@CONFIG@*/
/*@DATA@*/

/* ===================== Réglages ===================== */
const HEARTS = 3, DAILY_GOAL = 30;
const RANKS = [
  {xp:0, name:"Rouillé"}, {xp:100, name:"Dérouillé"}, {xp:300, name:"Opérationnel"},
  {xp:600, name:"Solide"}, {xp:950, name:"Confirmé"}, {xp:1300, name:"Expert backend"}
];
const DIFF = {1:{label:"Facile", base:15, cls:"d1"}, 2:{label:"Moyen", base:25, cls:"d2"}, 3:{label:"Difficile", base:35, cls:"d3"}};
const LANG = {python:"Python", sql:"SQL", bash:"Terminal", text:"Texte"};
const SYMBOLS = ["TAB", "UNTAB", ":", "(", ")", "[", "]", "{", "}", "\"", "'", "=", "_", ".", ",", "#", "*", "<", ">", "-", "/", ";", "%", "@"];
const reduceMotion = (() => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
/* Deux versions, un seul code : l'artifact claude.ai (synchro + correction par Claude) et le site installable (PWA). */
const IS_SITE = typeof BUILD !== "undefined" && BUILD.target === "site";
const APP_VERSION = typeof BUILD !== "undefined" ? BUILD.version : "dev";
const SITE_URL = typeof BUILD !== "undefined" ? BUILD.siteUrl : "";
const INSTALLED = (() => { try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }catch(e){ return false; } })();

/* ===================== Stockage local ===================== */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  keys(){ try{ return Object.keys(localStorage); }catch(e){ return []; } }
};
const parse = s => { try{ return s ? JSON.parse(s) : null; }catch(e){ return null; } };
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const LS_KEY = "derouille-v1", PREFS_KEY = "derouille-prefs", DRAFT = "derouille-draft:";
const prefs = Object.assign({sound:true, haptics:true}, parse(store.get(PREFS_KEY)) || {});
const savePrefs = () => store.set(PREFS_KEY, JSON.stringify(prefs));

/* ===================== État & synchronisation ===================== */
const blankStats = () => ({lessons:0, perfect:0, reviews:0, bestCombo:0, correct:0, answered:0});
const blank = () => ({xp:0, epoch:0, levels:{}, ex:{}, missed:[], badges:[], streak:0, bestStreak:0, lastDay:null,
  track:TRACKS[0].id, daily:{day:null, xp:0}, stats:blankStats(), session:null, sessionAt:0, drafts:{}, lastEx:null});
function normalize(raw){
  const o = isObj(raw) ? clone(raw) : {};
  const s = Object.assign(blank(), o);
  s.xp = Number(s.xp) || 0;
  s.epoch = Number(s.epoch) || 0;
  s.levels = isObj(o.levels) ? o.levels : {};
  s.ex = isObj(o.ex) ? o.ex : {};
  s.missed = Array.isArray(o.missed) ? o.missed.filter(k => typeof k === "string") : [];
  s.badges = Array.isArray(o.badges) ? o.badges.filter(k => typeof k === "string") : [];
  s.daily = Object.assign({day:null, xp:0}, isObj(o.daily) ? o.daily : {});
  s.stats = Object.assign(blankStats(), isObj(o.stats) ? o.stats : {});
  s.session = isObj(o.session) && Array.isArray(o.session.keys) ? o.session : null;
  s.sessionAt = Number(o.sessionAt) || 0;
  s.drafts = isObj(o.drafts) ? o.drafts : {};
  s.lastEx = typeof o.lastEx === "string" ? o.lastEx : null;
  if(!TRACKS.some(t => t.id === s.track)) s.track = TRACKS[0].id;
  return s;
}
/* Fusion de deux appareils : réinitialisation la plus récente d'abord, sinon on garde le meilleur de chaque côté. */
function mergeStates(a, b){
  a = normalize(a); b = normalize(b);
  if(a.epoch !== b.epoch) return a.epoch > b.epoch ? a : b;
  const hi = a.xp >= b.xp ? a : b, lo = hi === a ? b : a, m = clone(hi);
  for(const [k, v] of Object.entries(lo.levels)) if(!m.levels[k] || (m.levels[k].stars || 0) < (v.stars || 0)) m.levels[k] = v;
  for(const [k, v] of Object.entries(lo.ex)) if(!m.ex[k] || (m.ex[k].stars || 0) < (v.stars || 0)) m.ex[k] = v;
  m.badges = [...new Set([...m.badges, ...lo.badges])];
  if((lo.lastDay || "") > (m.lastDay || "")){ m.lastDay = lo.lastDay; m.streak = lo.streak; }
  m.bestStreak = Math.max(m.bestStreak, lo.bestStreak, m.streak);
  if((lo.daily.day || "") > (m.daily.day || "")) m.daily = lo.daily;
  else if(lo.daily.day && lo.daily.day === m.daily.day) m.daily.xp = Math.max(m.daily.xp, lo.daily.xp);
  for(const k of Object.keys(m.stats)) m.stats[k] = Math.max(m.stats[k] || 0, lo.stats[k] || 0);
  if(lo.sessionAt > m.sessionAt){ m.session = lo.session; m.sessionAt = lo.sessionAt; }
  for(const [k, d] of Object.entries(lo.drafts)) if(!m.drafts[k] || (m.drafts[k].at || 0) < (d.at || 0)) m.drafts[k] = d;
  for(const k of Object.keys(m.drafts)) if(m.ex[k] && (m.ex[k].at || 0) >= (m.drafts[k].at || 0)) delete m.drafts[k];
  if(!m.lastEx && lo.lastEx) m.lastEx = lo.lastEx;
  return m;
}
let S = normalize(parse(store.get(LS_KEY)));
/* Anciens brouillons (stockés par appareil) → progression synchronisée. */
for(const k of store.keys()){
  if(!k.startsWith(DRAFT)) continue;
  const key = k.slice(DRAFT.length), d = parse(store.get(k));
  if(isObj(d) && !S.drafts[key]) S.drafts[key] = Object.assign({}, d, {at: Date.now()});
  store.del(k);
}
let remote = null, saveChain = Promise.resolve(), synced = false;
function save(){
  store.set(LS_KEY, JSON.stringify(S));
  if(!remote) return;
  const snap = clone(S);
  saveChain = saveChain.then(() => remote.set(snap)).catch(() => {});
}
async function initRemote(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    const before = JSON.stringify(S);
    const theirs = snap.exists ? normalize(snap.data()) : null;
    if(theirs) S = mergeStates(S, theirs);
    remote = ref; synced = true;
    store.set(LS_KEY, JSON.stringify(S));
    const hasProgress = S.xp > 0 || Object.keys(S.levels).length > 0;
    if(theirs ? JSON.stringify(theirs) !== JSON.stringify(S) : hasProgress) save();
    if(JSON.stringify(S) !== before || view === "profile") rerender();
  }catch(e){ remote = null; synced = false; }
}

/* ===================== Sons (synthétisés, aucun fichier) ===================== */
const Sound = (() => {
  let ctx = null, master = null;
  function ac(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = .55;
      master.connect(ctx.destination);
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(m, at, dur, o = {}){
    const c = ac(); if(!c) return;
    const t = c.currentTime + at, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "triangle";
    osc.frequency.setValueAtTime(hz(m), t);
    if(o.to != null) osc.frequency.exponentialRampToValueAtTime(hz(o.to), t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol == null ? .2 : o.vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + .05);
  }
  const fx = {
    tap(){ tone(84, 0, .05, {vol:.08}); },

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
function prose(lines){
  let html = "", list = [];
  const flush = () => { if(list.length){ html += "<ul>" + list.map(li => "<li>" + md(li) + "</li>").join("") + "</ul>"; list = []; } };
  for(const l of lines){ if(l.startsWith("- ")) list.push(l.slice(2)); else { flush(); html += "<p>" + md(l) + "</p>"; } }
  flush();
  return html;
}
const shuffle = a => { const b = a.slice(); for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const KW_PY = new Set("def return if elif else for in while class import from as with try except finally raise pass None True False and or not lambda is yield async await assert break continue global del".split(" "));
const KW_SQL = new Set("SELECT FROM WHERE JOIN LEFT RIGHT INNER OUTER ON GROUP BY ORDER LIMIT OFFSET HAVING COUNT SUM AVG MIN MAX AS DESC ASC AND OR NOT NULL IS LIKE ILIKE IN INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE INDEX BEGIN COMMIT ROLLBACK PRIMARY KEY UNIQUE DISTINCT EXPLAIN ANALYZE TRUE FALSE".split(" "));
const KW_SH = new Set("git cd ls pip python".split(" "));
const KW_HTTP = new Set("GET POST PUT PATCH DELETE".split(" "));
function hl(src, lang){
  const sql = lang === "sql";
  const re = sql
    ? /(--[^\n]*)|('(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g
    : /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(@?[A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m;
  while((m = re.exec(src))){
    if(m[1]) out += '<span class="c">' + esc(m[1]) + "</span>";
    else if(m[2]) out += '<span class="s">' + esc(m[2]) + "</span>";
    else if(m[3]) out += '<span class="n">' + m[3] + "</span>";
    else if(m[4]){
      const w = m[4];
      const kw = sql ? KW_SQL.has(w.toUpperCase()) : lang === "bash" ? KW_SH.has(w) : lang === "text" ? KW_HTTP.has(w) : (KW_PY.has(w) || KW_SQL.has(w) || w[0] === "@");
      if(kw) out += '<span class="k">' + esc(w) + "</span>";
      else if(src[re.lastIndex] === "(") out += '<span class="f">' + esc(w) + "</span>";
      else out += esc(w);
    }
    else out += esc(m[5]);
  }
  return out;
}

function floatText(text, anchor, cls = ""){

function confetti(power = 1){
  if(reduceMotion) return;
  const c = document.createElement("canvas");
  c.className = "confetti";
  document.body.appendChild(c);
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext("2d");
  if(!ctx){ c.remove(); return; }
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colors = ["--t-python", "--t-django", "--t-drf", "--t-sql", "--gold", "--t-http", "--good", "--flame"].map(v => css.getPropertyValue(v).trim() || "#F5B73B");
  const P = [];
  const n = Math.round(70 * power);
  for(const side of [0, 1]) for(let i = 0; i < n; i++){
    const dir = side ? -1 : 1, sp = 9 + Math.random() * 9, ang = (55 + Math.random() * 30) * Math.PI / 180;
    P.push({x: side ? W + 10 : -10, y: H * .78, vx: dir * Math.cos(ang) * sp, vy: -Math.sin(ang) * sp * 1.35, w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
      r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[(i + side) % colors.length]});
  }
  const t0 = performance.now(); let last = t0;
  function frame(t){
    const dt = Math.min(34, t - last) / 16.67; last = t;
    const age = t - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1800) / 900);
    for(const p of P){
      p.vy += .32 * dt; p.vx *= .992; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1);
      ctx.restore();
    }
    if(age < 2700) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}
function countUp(el, to, dur = 900){
  if(!el) return;
  if(reduceMotion || !to){ el.textContent = to; return; }
  const t0 = performance.now(); let lastTick = 0;
  function f(t){
    const k = Math.min(1, (t - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
    el.textContent = v;
    if(k < 1 && t - lastTick > 70){ Sound.play("tick"); lastTick = t; }
    if(k < 1) requestAnimationFrame(f);
  }

}

async function copyText(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  return false;
}
function b64url(bytes){
  let s = "";
  for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(str){
  const s = atob(str.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - str.length % 4) % 4));
  const b = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
/* Code de sauvegarde : « DEROUILLE1. » + progression en JSON (compressée si le navigateur sait le faire). */
async function exportCode(){
  const json = JSON.stringify(S);
  try{
    if(window.CompressionStream){
      const gz = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
      return "DEROUILLE1.G" + b64url(new Uint8Array(gz));
    }
  }catch(e){}
  return "DEROUILLE1.J" + b64url(new TextEncoder().encode(json));
}
async function importCode(text){
  const m = /DEROUILLE1\.([GJ])([A-Za-z0-9_-]+)/.exec(String(text).replace(/\s+/g, ""));
  if(!m) throw new Error("format");
  const bytes = unb64url(m[2]);
  const json = m[1] === "G"
    ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    : new TextDecoder().decode(bytes);
  const data = JSON.parse(json);
  if(!isObj(data) || typeof data.xp !== "number" || !isObj(data.levels)) throw new Error("contenu");
  return data;
}

/* ===================== Leçon (quiz) ===================== */
let L = null;
function startLevel(tr, li){
  const items = tr.levels[li].qs.map((q, qi) => ({q, key:qKey(tr.id, li, qi), color:tr.color}));
  begin({mode:"level", tr, li, items, title:tr.levels[li].title});
}
function startReview(){
  const items = shuffle(S.missed.map(getQ).filter(Boolean)).slice(0, 8).map(g => ({q:g.q, key:g.key, color:g.track.color}));
  if(!items.length) return;
  begin({mode:"review", items, title:"Révision"});
}
function begin(o){
  L = Object.assign(o, {queue:o.items.slice(), total:o.items.length, solved:0, hearts:HEARTS, mistakes:0, wrong:new Set(), ans:null, combo:0, bestCombo:0, bonus:0, outcome:null});
  persistSession();
  save();
  openLesson();
}
function openLesson(){
  view = "lesson";
  showTabbar(false);
  window.scrollTo(0, 0);
  renderQuestion();
}
/* Leçon en cours : sauvegardée après chaque réponse (et synchronisée), pour reprendre où on s'est arrêté. */
function snapshotSession(){
  return {mode:L.mode, track:L.tr ? L.tr.id : null, li:L.mode === "level" ? L.li : null, title:L.title,
    keys:L.queue.map(it => it.key), total:L.total, solved:L.solved, hearts:L.hearts, mistakes:L.mistakes,
    wrong:[...L.wrong], combo:L.combo, bestCombo:L.bestCombo, bonus:L.bonus};
}
function persistSession(){ S.session = L ? snapshotSession() : null; S.sessionAt = Date.now(); }
function discardSession(){ S.session = null; S.sessionAt = Date.now(); save(); }
function sessionInfo(){
  const s = S.session;
  if(!s) return null;
  const items = s.keys.map(getQ).filter(Boolean);
  const tr = s.mode === "level" ? TRACKS.find(t => t.id === s.track) : null;
  if(!items.length || !(s.hearts > 0) || (s.mode === "level" && (!tr || !tr.levels[s.li]))) return null;
  return {s, items, tr};
}
function resumeLesson(){
  const info = sessionInfo();
  if(!info){ discardSession(); rerender(); return; }
  const {s, items, tr} = info;
  L = {mode:s.mode, tr, li:s.li, title: tr ? tr.levels[s.li].title : "Révision",
    queue: items.map(g => ({q:g.q, key:g.key, color:g.track.color})), total:s.total, solved:s.solved, hearts:s.hearts,
    mistakes:s.mistakes || 0, wrong:new Set(s.wrong || []), ans:null, combo:s.combo || 0, bestCombo:s.bestCombo || 0,
    bonus:s.bonus || 0, outcome:null};
  Sound.play("start");
  openLesson();
}
function pauseLesson(){
  if(!L) return;
  if(L.outcome){ const ctx = L, r = L.outcome; L = null; renderResult(ctx, r); return; }
  persistSession();
  save();
  L = null;
  Sound.play("tap");
  go("learn");
  toast(`${ICON.check}<span><b>Leçon en pause</b>Tu reprendras à la question où tu t'es arrêté${synced ? ", même sur un autre appareil" : ""}.</span>`);
}
function renderQuestion(){
  const it = L.queue[0], q = it.q;
  L.ans = q.t === "mc" ? null : [];
  const kind = {mc:"Choisis la bonne réponse", fill:"Complète le code", order:"Remets dans l'ordre"}[q.t];
  let body = "";
  if(q.t === "mc"){
    L.opts = shuffle(q.o.map((txt, i) => ({txt, ok:i === q.a})));
    body = (q.code ? `<pre class="code">${hl(q.code)}</pre>` : "") +
      `<div class="opts">${L.opts.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false"><span class="key">${"ABCD"[i]}</span><span>${md(o.txt)}</span></button>`).join("")}</div>`;
  } else if(q.t === "fill"){
    let n = 0;
    const code = hl(q.code.replace(/___/g, "\u0001")).replace(/\u0001/g, () => { n++; return `<button class="slot" data-s="${n - 1}" aria-label="Trou ${n}">&nbsp;</button>`; });
    L.slots = n;
    L.chips = shuffle(q.c);
    body = `<pre class="code">${code}</pre><div class="chips">${L.chips.map((c, i) => `<button class="chip" data-c="${i}">${esc(c)}</button>`).join("")}</div>`;
  } else {
    let sh = shuffle(q.lines.map((l, i) => i));
    if(sh.every((v, i) => v === i)) sh = sh.reverse();
    body = `<div class="built" id="built"></div><div class="chips" style="display:grid">${sh.map(i => `<button class="chip line-chip" data-l="${i}">${esc(q.lines[i])}</button>`).join("")}</div>`;
  }
  $app.innerHTML = `
  <div class="lesson" style="--tc:var(${it.color})">
    <div class="lbar">
      <button class="icon-btn" id="quit" aria-label="Mettre la leçon en pause">${ICON.close}</button>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.solved}"><i style="width:${L.solved / L.total * 100}%"></i></div>
      <span class="hearts" id="hearts" aria-label="${L.hearts} vies restantes">${ICON.heart}${L.hearts}</span>
      <span class="combo ${L.combo >= 2 ? "on" : ""}" id="combo" aria-live="polite">${ICON.flame}×${L.combo}</span>
    </div>
    <main class="qzone">
      <div class="qkind">${kind}</div>
      <div class="qtext">${md(q.q)}</div>
      ${body}
    </main>
    <div class="action" id="action" aria-live="polite"><div class="action-inner"><button class="btn" id="check" disabled>Vérifier</button></div></div>
  </div>`;
  document.getElementById("quit").onclick = pauseLesson;
  document.getElementById("check").onclick = check;
  if(q.t === "mc"){
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      $app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      L.ans = +b.dataset.i;
      Sound.play("select");
      updateCheck();
    });
  } else if(q.t === "fill"){
    $app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      const free = [...Array(L.slots).keys()].find(s => L.ans[s] == null);
      if(free == null) return;
      L.ans[free] = +b.dataset.c;
      b.classList.add("used");
      Sound.play("select");
      paintSlots();
    });
    $app.querySelectorAll(".slot").forEach(s => s.onclick = () => {
      const k = +s.dataset.s;
      if(L.ans[k] == null) return;
      $app.querySelector(`.chip[data-c="${L.ans[k]}"]`).classList.remove("used");
      L.ans[k] = null;
      Sound.play("tap");
      paintSlots();
    });
  } else {
    $app.querySelectorAll(".chips .line-chip").forEach(b => b.onclick = () => {
      L.ans.push(+b.dataset.l);
      b.classList.add("used");
      Sound.play("select");
      paintBuilt();
    });
  }
}
function paintSlots(){
  $app.querySelectorAll(".slot").forEach(s => {
    const v = L.ans[+s.dataset.s];
    s.textContent = v == null ? " " : L.chips[v];
    s.classList.toggle("filled", v != null);
  });
  updateCheck();
}
function paintBuilt(){
  const q = L.queue[0].q, built = document.getElementById("built");
  built.innerHTML = L.ans.map((li, k) => `<button class="chip line-chip" data-k="${k}">${esc(q.lines[li])}</button>`).join("");
  built.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const li = L.ans.splice(+b.dataset.k, 1)[0];
    $app.querySelector(`.chips .line-chip[data-l="${li}"]`).classList.remove("used");
    Sound.play("tap");
    paintBuilt();
  });
  updateCheck();
}
function updateCheck(){
  const q = L.queue[0].q;
  const ready = q.t === "mc" ? L.ans != null
    : q.t === "fill" ? [...Array(L.slots).keys()].every(s => L.ans[s] != null)
    : L.ans.length === q.lines.length;
  document.getElementById("check").disabled = !ready;
}
function check(){
  const it = L.queue[0], q = it.q;
  let ok, solution = "";
  if(q.t === "mc"){
    ok = L.opts[L.ans].ok;
    $app.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if(L.opts[i].ok) b.classList.add("ok"); else if(i === L.ans) b.classList.add("ko"); });
  } else if(q.t === "fill"){
    ok = q.a.every((v, i) => L.chips[L.ans[i]] === v);
    solution = "Réponse : <code>" + q.a.map(esc).join("</code>, <code>") + "</code>";
    $app.querySelectorAll(".chip,.slot").forEach(b => b.disabled = true);
  } else {
    ok = L.ans.every((v, i) => q.lines[v] === q.lines[i]);
    solution = `<pre class="code" style="margin-top:6px">${hl(q.lines.join("\n"))}</pre>`;
    $app.querySelectorAll(".chip").forEach(b => b.disabled = true);
  }
  L.queue.shift();
  S.stats.answered++;
  const heartsEl = document.getElementById("hearts"), comboEl = document.getElementById("combo");
  if(ok){
    L.solved++; L.combo++; S.stats.correct++;
    L.bestCombo = Math.max(L.bestCombo, L.combo);
    if(!L.wrong.has(it.key)) S.missed = S.missed.filter(k => k !== it.key);
    Sound.play("correct");
    buzz(12);
    if(L.combo >= 3){
      L.bonus++;
      setTimeout(() => Sound.play("combo", L.combo), 200);
      floatText("+1 XP combo", comboEl, "gold");
    }
  } else {
    L.hearts--; L.mistakes++; L.combo = 0;
    L.wrong.add(it.key);
    if(!S.missed.includes(it.key)) S.missed.push(it.key);
    L.queue.push(it);
    Sound.play("wrong");
    setTimeout(() => Sound.play("heart"), 170);
    buzz([30, 50, 30]);
    const qz = $app.querySelector(".qzone");
    if(qz && !reduceMotion){ qz.classList.remove("shake"); void qz.offsetWidth; qz.classList.add("shake"); }
  }
  heartsEl.innerHTML = ICON.heart + L.hearts;
  heartsEl.setAttribute("aria-label", L.hearts + " vies restantes");
  if(!ok){ heartsEl.classList.add("hit"); floatText("−1", heartsEl, "bad"); }
  comboEl.innerHTML = ICON.flame + "×" + L.combo;
  comboEl.classList.toggle("on", L.combo >= 2);
  if(L.combo >= 2){ comboEl.classList.remove("bump"); void comboEl.offsetWidth; comboEl.classList.add("bump"); }
  $app.querySelector(".lbar .bar>i").style.width = (L.solved / L.total * 100) + "%";
  /* Fin de leçon (réussie ou plus de vies) : enregistrée tout de suite, même si l'app est fermée avant « Continuer ». */
  const over = L.hearts <= 0 ? false : !L.queue.length ? true : null;
  if(over !== null) L.outcome = finalize(L, over);
  else persistSession();
  save();
  const act = document.getElementById("action");
  act.className = "action " + (ok ? "good" : "bad");
  const praise = L.combo >= 5 ? "Inarrêtable !" : L.combo >= 3 ? "Combo ×" + L.combo + " !" : ["Bien joué !", "Exact !", "Parfait !", "Ça revient !"][Math.floor(Math.random() * 4)];
  act.innerHTML = `<div class="action-inner">
    <div class="fb-title">${ok ? ICON.ok + esc(praise) : ICON.ko + "Pas tout à fait"}</div>
    <div class="explain">${!ok && solution ? solution + "<br>" : ""}${md(q.x)}</div>
    <button class="btn" id="next">${L.outcome ? "Voir le résultat" : "Continuer"}</button></div>`;
  const nx = document.getElementById("next");
  try{ nx.focus({preventScroll:true}); }catch(e){}
  nx.onclick = () => {
    if(L.outcome){ const ctx = L, r = L.outcome; L = null; renderResult(ctx, r); return; }
    window.scrollTo(0, 0);
    renderQuestion();
  };
}
function finalize(ctx, passed){
  S.stats.bestCombo = Math.max(S.stats.bestCombo, ctx.bestCombo);
  const xpBefore = S.xp, dailyBefore = dailyXp();
  let gained = 0, stars = 0, ev = {}, firstTime = false;
  if(passed){
    stars = ctx.mistakes === 0 ? 3 : ctx.mistakes === 1 ? 2 : 1;
    S.stats.lessons++;
    if(ctx.mistakes === 0) S.stats.perfect++;
    if(ctx.mode === "level"){
      const k = ctx.tr.id + ":" + ctx.li, prev = S.levels[k];
      firstTime = !prev;
      gained = (prev ? 5 : 10 + stars * 5) + ctx.bonus;
      S.levels[k] = {stars: Math.max(stars, prev ? prev.stars : 0)};
      if(firstTime) fresh = {track: ctx.tr.id, level: ctx.li};
    } else {
      S.stats.reviews++;
      gained = ctx.total * 2 + ctx.bonus;
    }
    ev = gainXp(gained);
    bumpStreak();
  }
  S.session = null;
  S.sessionAt = Date.now();
  const badges = checkBadges();
  return {passed, stars, gained, firstTime, xpBefore, dailyBefore, ev, badges};
}
function renderResult(ctx, r){
  view = "result";
  showTabbar(false);
  window.scrollTo(0, 0);
  const ri = rankInfo(S.xp), rb = rankInfo(r.xpBefore);
  const tr = ctx.tr;
  const defi = r.passed && ctx.mode === "level" && !S.ex[tr.id + ":" + ctx.li] ? exFor(tr.id, ctx.li) : null;
  const nextLevel = r.passed && ctx.mode === "level" && ctx.li + 1 < tr.levels.length ? ctx.li + 1 : null;
  const title = !r.passed ? "Plus de vies" : r.stars === 3 ? "Sans faute !" : ctx.mode === "review" ? "Révision terminée" : "Niveau terminé";
  const text = !r.passed ? "Les questions ratées sont dans ta révision. Relis les explications et retente."
    : ctx.mode === "review" ? "Les questions réussies du premier coup sortent de ta liste."
    : defi && r.firstTime ? "Nouveau défi code débloqué : mets les mains dans le code."
    : "« " + esc(ctx.title) + " » est validé.";
  $app.innerHTML = `<div class="result" style="--tc:var(${tr ? tr.color : "--accent"})">
    ${r.passed ? `<div class="big-stars" aria-label="${r.stars} étoiles sur 3">${bigStars(r.stars)}</div>` : `<div class="broken">${ICON.broken}</div>`}
    <h1>${title}</h1>
    <p>${text}</p>
    ${r.passed ? `<div class="tiles">
      <div class="tile"><b id="xpGain">0</b><span>XP gagnés</span></div>
      <div class="tile"><b>${ctx.bestCombo}</b><span>Meilleur combo</span></div>
      <div class="tile"><b>${liveStreak()}</b><span>Série</span></div>
    </div>
    <div class="meter"><div class="rank-row"><b>Objectif du jour</b><span>${Math.min(dailyXp(), DAILY_GOAL)} / ${DAILY_GOAL} XP</span></div><div class="bar goal"><i id="goalBar" style="width:${Math.min(100, r.dailyBefore / DAILY_GOAL * 100)}%"></i></div></div>
    <div class="meter"><div class="rank-row"><b>${esc(ri.cur.name)}</b><span>${ri.next ? (ri.next.xp - S.xp) + " XP avant « " + esc(ri.next.name) + " »" : "Rang maximum"}</span></div><div class="bar"><i id="rankBar" style="width:${rb.cur === ri.cur ? rb.pct : 0}%"></i></div></div>` : ""}
    <div class="col">
      ${defi ? `<button class="btn" id="goDefi">${ICON.code}Relever le défi code</button>` : ""}
      ${nextLevel != null ? `<button class="btn ${defi ? "ghost" : ""}" id="nextLv">Niveau suivant</button>` : ""}
      ${!r.passed && ctx.mode === "level" ? `<button class="btn" id="retry">Réessayer</button>` : ""}
      <button class="btn ghost" id="home">Retour au parcours</button>
    </div>
  </div>`;
  if(r.passed){
    Sound.play("complete");
    buzz([20, 40, 20]);
    confetti(r.stars === 3 ? 1.3 : .9);
    for(let i = 0; i < r.stars; i++) setTimeout(() => Sound.play("star", i), 420 + i * 300);
    setTimeout(() => countUp(document.getElementById("xpGain"), r.gained), 900);
    grow(document.getElementById("goalBar"), dailyXp() / DAILY_GOAL * 100);
    grow(document.getElementById("rankBar"), ri.pct);
    celebrate(r.ev, r.badges, 1900);
  } else {
    Sound.play("fail");
    buzz([60, 40, 60]);
    celebrate({}, r.badges, 900);
  }
  document.getElementById("home").onclick = () => { Sound.play("tap"); go("learn"); };
  const rt = document.getElementById("retry"); if(rt) rt.onclick = () => { Sound.play("start"); startLevel(tr, ctx.li); };
  const nl = document.getElementById("nextLv"); if(nl) nl.onclick = () => { Sound.play("start"); startLevel(tr, nextLevel); };
  const gd = document.getElementById("goDefi"); if(gd) gd.onclick = () => { Sound.play("tap"); startExercise(tr, ctx.li, "learn"); };
  const first = document.querySelector(".result .btn");
  if(first) try{ first.focus({preventScroll:true}); }catch(e){}
}

let X = null;
let grader = null, graderState = "pending";
const gradeCache = new Map();
const normCode = s => s.replace(/[ \t]+$/gm, "").trim();
const SMART_TEST = /[“”„«»‘’‚—–…]/;
const SMART_ALL = /[“”„«»‘’‚—–…]/g;
const SMART_MAP = {"“":'"', "”":'"', "„":'"', "«":'"', "»":'"', "‘":"'", "’":"'", "‚":"'", "—":"--", "–":"-", "…":"..."};
const unsmart = s => s.replace(SMART_ALL, c => SMART_MAP[c]);
const graderReady = (async () => {
  try{
    if(!window.claude || typeof window.claude.use !== "function"){ graderState = "off"; return; }
    const s = await window.claude.use("sample");

function autosize(ta){
  ta.style.height = "auto";
  const extra = ta.offsetHeight - ta.clientHeight;

}
function insertText(ta, text){
  try{ ta.focus({preventScroll:true}); }catch(e){ ta.focus(); }

  try{ ok = document.execCommand("insertText", false, text); }catch(e){}
  if(!ok){
    ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input", {bubbles:true}));
  }
}
function lineStart(v, pos){ return pos === 0 ? 0 : v.lastIndexOf("\n", pos - 1) + 1; }
function newline(ta, lang){
  const v = ta.value, s = ta.selectionStart;
  const line = v.slice(lineStart(v, s), s);
  const indent = (line.match(/^[ \t]*/) || [""])[0];
  const extra = lang !== "sql" && /[:(\[{]\s*$/.test(line) ? "    " : "";

}
function dedent(ta){
  const v = ta.value, s = ta.selectionStart, ls = lineStart(v, s);
  const m = v.slice(ls).match(/^ {1,4}/);
  if(!m) return;
  ta.setRangeText("", ls, ls + m[0].length, "start");
  const pos = Math.max(ls, s - m[0].length);
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event("input", {bubbles:true}));
  try{ ta.focus({preventScroll:true}); }catch(e){}
}

function parseGrade(r, ex){
  if(!isObj(r) || typeof r.syntaxe_ok !== "boolean" || !Array.isArray(r.criteres) || r.criteres.length !== ex.criteria.length) return null;
  if(r.criteres.some(c => !isObj(c) || typeof c.ok !== "boolean")) return null;
  const crit = r.criteres.map((c, i) => ({label: ex.criteria[i], bonus: /^Bonus\b/i.test(ex.criteria[i]), ok: c.ok, note: typeof c.note === "string" ? c.note : ""}));
  const fails = crit.filter(c => !c.bonus && !c.ok).length + (r.syntaxe_ok ? 0 : 1);
  return {
    verdict: fails === 0 ? "reussi" : fails === 1 ? "presque" : "a_revoir",
    syntaxOk: r.syntaxe_ok, crit,
    feedback: typeof r.feedback === "string" ? r.feedback : "",
    fix: Array.isArray(r.a_corriger) ? r.a_corriger.filter(x => typeof x === "string" && x.trim()).slice(0, 3) : []

}

    box.value = text;
    box.focus();
    box.select();
    toast(`${ICON.copy}<span>Copie automatique refusée : la demande est sélectionnée, copie-la à la main.</span>`, "warn");
  };
  okBtn.onclick = () => {
    sh.close();
    showVerdict({verdict:"reussi", syntaxOk:true, crit:[], feedback:"Validé en auto-évaluation. Compare quand même ton code avec la référence ci-dessous.", fix:[]}, X.ta.value, true);
  };
}

/* ===================== Démarrage ===================== */
/* On rouvre sur la leçon en pause s'il y en a une, sinon sur le dernier onglet utilisé. */
go(sessionInfo() ? "learn" : ["learn", "code", "profile"].includes(prefs.tab) ? prefs.tab : "learn");
initRemote();
/* App installée : on demande au navigateur de ne pas effacer la progression pour faire de la place. */
if(IS_SITE && INSTALLED && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
